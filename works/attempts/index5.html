<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snowy Mountain in Three.js</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000; /* Fallback */
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- Include Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
      // Scene setup
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Create a larger pyramid-shaped mountain
      const pyramidGeometry = new THREE.ConeGeometry(40, 120, 4); // Increased: Base radius 40, height 120
      const pyramidMaterial = new THREE.MeshPhongMaterial({
        color: 0x3c2f2f, // Deep brown to contrast with the fog
      });
      const pyramid = new THREE.Mesh(pyramidGeometry, pyramidMaterial);
      pyramid.position.y = -40; // Base at y = -100, peak at y = 20
      scene.add(pyramid);

      // Add a larger secondary pyramid
      const pyramid2Geometry = new THREE.ConeGeometry(30, 80, 4); // Increased: Base radius 30, height 80
      const pyramid2 = new THREE.Mesh(pyramid2Geometry, pyramidMaterial);
      pyramid2.position.set(20, -20, 10); // Base at y = -60, peak at y = 20
      scene.add(pyramid2);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0x404040);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(0, 50, 50);
      scene.add(directionalLight);

      // Starry background (only above the horizon)
      const starGeometry = new THREE.BufferGeometry();
      const starCount = 1000;
      const starPositions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount * 3; i += 3) {
        let x, y, z;
        do {
          x = (Math.random() - 0.5) * 2000;
          y = (Math.random() - 0.5) * 2000;
          z = (Math.random() - 0.5) * 2000;
        } while (y < 50); // Ensure stars are above y=50
        starPositions[i] = x;
        starPositions[i + 1] = y;
        starPositions[i + 2] = z;
      }
      starGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(starPositions, 3)
      );
      const starMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 2,
      });
      const stars = new THREE.Points(starGeometry, starMaterial);
      scene.add(stars);

      // Create the planet's curved horizon
      const horizonGeometry = new THREE.SphereGeometry(
        500,
        64,
        64,
        0,
        Math.PI * 2,
        0,
        Math.PI / 6
      );
      const horizonMaterial = new THREE.MeshBasicMaterial({
        color: 0x87ceeb, // Light blue for the atmosphere
        transparent: true,
        opacity: 0.5,
        side: THREE.BackSide,
      });
      const horizon = new THREE.Mesh(horizonGeometry, horizonMaterial);
      horizon.position.y = -450; // Position below the mountain
      scene.add(horizon);

      // Shader for fog layers
      const fogVertexShader = `
            varying vec2 vUv;
            uniform float time;
            void main() {
                vUv = uv;
                // Add subtle breathing effect by modifying position
                vec3 pos = position;
                pos.z += sin(pos.x * 0.01 + time) * 2.0; // Breathing effect
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;
      const fogFragmentShader = `
            varying vec2 vUv;
            uniform float time;
            // Simple noise function for cloud effect
            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
            }
            float noise(vec2 st) {
                vec2 i = floor(st);
                vec2 f = fract(st);
                float a = random(i);
                float b = random(i + vec2(1.0, 0.0));
                float c = random(i + vec2(0.0, 1.0));
                float d = random(i + vec2(1.0, 1.0));
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
            }
            void main() {
                vec2 uv = vUv * 5.0; // Scale UV for larger cloud patterns
                float n = noise(uv + time * 0.1); // Animate noise over time
                // Define two colors: white and light gray
                vec3 color1 = vec3(1.0, 1.0, 1.0); // White
                vec3 color2 = vec3(0.8, 0.8, 0.85); // Light gray with a slight blue tint
                // Mix colors based on noise
                vec3 color = mix(color1, color2, n);
                // Adjust alpha to ensure it doesn't drop too low
                float alpha = smoothstep(0.2, 0.8, n) * 0.9 + 0.1; // Minimum alpha of 0.1
                // Fade out towards the top to blend with horizon
                alpha *= smoothstep(1.0, 0.0, vUv.y);
                gl_FragColor = vec4(color, alpha);
            }
        `;

      // Background fog layer to cover the entire viewport below the horizon
      const backgroundFogGeometry = new THREE.PlaneGeometry(5000, 5000, 32, 32);
      const backgroundFogMaterial = new THREE.ShaderMaterial({
        vertexShader: fogVertexShader,
        fragmentShader: fogFragmentShader,
        uniforms: { time: { value: 0 } },
        transparent: true,
      });
      const backgroundFog = new THREE.Mesh(
        backgroundFogGeometry,
        backgroundFogMaterial
      );
      backgroundFog.rotation.x = -Math.PI / 2;
      backgroundFog.position.y = -500; // Far below the horizon
      scene.add(backgroundFog);

      // Fog layer 1: Below the mountain bases
      const fogGeometry1 = new THREE.PlaneGeometry(2000, 2000, 32, 32);
      const fogMaterial1 = new THREE.ShaderMaterial({
        vertexShader: fogVertexShader,
        fragmentShader: fogFragmentShader,
        uniforms: { time: { value: 0 } },
        transparent: true,
      });
      const fog1 = new THREE.Mesh(fogGeometry1, fogMaterial1);
      fog1.rotation.x = -Math.PI / 2;
      fog1.position.y = -110; // Adjusted: Below the larger mountain bases (base at y = -100)
      scene.add(fog1);

      // Fog layer 2: Overlaps the midsection of the mountains
      const fogGeometry2 = new THREE.PlaneGeometry(2000, 2000, 32, 32);
      const fogMaterial2 = new THREE.ShaderMaterial({
        vertexShader: fogVertexShader,
        fragmentShader: fogFragmentShader,
        uniforms: { time: { value: 0 } },
        transparent: true,
      });
      const fog2 = new THREE.Mesh(fogGeometry2, fogMaterial2);
      fog2.rotation.x = -Math.PI / 2;
      fog2.position.y = -10; // Adjusted: Overlaps midsection of larger mountains
      scene.add(fog2);

      // Fog layer 3: Just below the peaks
      const fogGeometry3 = new THREE.PlaneGeometry(2000, 2000, 32, 32);
      const fogMaterial3 = new THREE.ShaderMaterial({
        vertexShader: fogVertexShader,
        fragmentShader: fogFragmentShader,
        uniforms: { time: { value: 0 } },
        transparent: true,
      });
      const fog3 = new THREE.Mesh(fogGeometry3, fogMaterial3);
      fog3.rotation.x = -Math.PI / 2;
      fog3.position.y = 10; // Adjusted: Just below the peaks (peaks at y = 20)
      scene.add(fog3);

      // Add scene fog to enhance the misty effect
      scene.fog = new THREE.Fog(0xcccccc, 20, 80);

      // Camera position (adjusted to accommodate larger mountains)
      camera.position.set(0, 60, 150); // Moved back and up to see the larger mountains
      camera.lookAt(0, 20, 0);

      // Animation loop
      let time = 0;
      function animate() {
        requestAnimationFrame(animate);
        time += 0.01;
        // Update fog materials for animations
        backgroundFogMaterial.uniforms.time.value = time;
        fogMaterial1.uniforms.time.value = time;
        fogMaterial2.uniforms.time.value = time + 0.5;
        fogMaterial3.uniforms.time.value = time + 1.0;
        // Slow rotation for pyramids
        pyramid.rotation.y += 0.005;
        pyramid2.rotation.y += 0.005;
        renderer.render(scene, camera);
      }
      animate();

      // Handle window resize
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
