<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mountain Piercing Through Planetary Clouds</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000011;
      }
      canvas {
        display: block;
      }
      .info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: monospace;
        background-color: rgba(0, 0, 0, 0.5);
        padding: 10px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="info">Mountains Piercing Through Planetary Cloud Layers</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Initialize scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          10000
        );
        const renderer = new THREE.WebGLRenderer({ antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000022);
        document.body.appendChild(renderer.domElement);

        // Camera position - above looking down at an angle
        camera.position.set(0, 300, 600);
        camera.lookAt(0, 0, -500);

        // Add ambient light
        const ambientLight = new THREE.AmbientLight(0x333344);
        scene.add(ambientLight);

        // Add moonlight
        const moonLight = new THREE.DirectionalLight(0x8888ff, 1);
        moonLight.position.set(100, 300, 100);
        scene.add(moonLight);

        // Add some soft directional light to highlight mountain peaks
        const peakLight = new THREE.DirectionalLight(0xffffdd, 0.7);
        peakLight.position.set(-100, 400, 200);
        scene.add(peakLight);

        // Create a starry background
        const createStars = () => {
          const starsGeometry = new THREE.BufferGeometry();
          const starsMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 1.2,
          });

          const starsVertices = [];
          for (let i = 0; i < 10000; i++) {
            const x = (Math.random() - 0.5) * 10000;
            const y = (Math.random() - 0.5) * 5000 + 1000;
            const z = (Math.random() - 0.5) * 10000 - 2000;
            starsVertices.push(x, y, z);
          }

          starsGeometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(starsVertices, 3)
          );
          const stars = new THREE.Points(starsGeometry, starsMaterial);
          scene.add(stars);
          return stars;
        };

        const stars = createStars();

        // Create a moon
        const createMoon = () => {
          const moonGeometry = new THREE.SphereGeometry(100, 32, 32);
          const moonMaterial = new THREE.MeshBasicMaterial({ color: 0xffffee });
          const moon = new THREE.Mesh(moonGeometry, moonMaterial);
          moon.position.set(600, 400, -2000);
          scene.add(moon);

          const moonGlowGeometry = new THREE.SphereGeometry(130, 32, 32);
          const moonGlowMaterial = new THREE.MeshBasicMaterial({
            color: 0xaaaaff,
            transparent: true,
            opacity: 0.3,
          });
          const moonGlow = new THREE.Mesh(moonGlowGeometry, moonGlowMaterial);
          moonGlow.position.copy(moon.position);
          scene.add(moonGlow);

          return { moon, moonGlow };
        };

        const moonObj = createMoon();

        // Create the main mountain
        const createMountains = () => {
          const mountainGeometry = new THREE.ConeGeometry(300, 600, 5);
          const mountainMaterial = new THREE.MeshStandardMaterial({
            color: 0x444455,
            roughness: 0.9,
            metalness: 0.1,
          });
          const mountain = new THREE.Mesh(mountainGeometry, mountainMaterial);
          mountain.position.set(0, -250, -600);
          mountain.rotation.y = Math.PI / 5;
          scene.add(mountain);

          const peaks = [
            { x: -500, y: -280, z: -800, scale: 1.5 },
            { x: 500, y: -270, z: -900, scale: 1.2 },
            { x: -300, y: -260, z: -1000, scale: 0.8 },
            { x: 300, y: -250, z: -800, scale: 0.9 },
          ];

          const mountainPeaks = [];
          peaks.forEach((peak) => {
            const peakGeo = new THREE.ConeGeometry(
              300 * peak.scale,
              600 * peak.scale,
              5
            );
            const peakMesh = new THREE.Mesh(peakGeo, mountainMaterial);
            peakMesh.position.set(peak.x, peak.y, peak.z);
            peakMesh.rotation.y = Math.random() * Math.PI;
            scene.add(peakMesh);
            mountainPeaks.push(peakMesh);
          });

          return { mountain, mountainPeaks };
        };

        const mountains = createMountains();

        // Helper function to convert viewport percentage to world Y coordinate
        const viewportPercentToWorldY = (percent) => {
          const fov = (camera.fov * Math.PI) / 180;
          const visibleHeightAtRef =
            2 * Math.tan(fov / 2) * Math.abs(camera.position.z - -500);
          const viewportHeight = visibleHeightAtRef;
          const normalizedPercent = percent / 100;
          return -viewportHeight / 2 + normalizedPercent * viewportHeight;
        };

        // Create planetary surface with curved horizon
        const createPlanetarySurface = () => {
          // Create a large sphere for the planet surface
          const planetRadius = 8000;
          const planetGeometry = new THREE.SphereGeometry(planetRadius, 64, 64);
          const planetMaterial = new THREE.MeshStandardMaterial({
            color: 0x8899cc,
            transparent: true,
            opacity: 0.8,
            roughness: 0.7,
            metalness: 0.1,
          });

          const planet = new THREE.Mesh(planetGeometry, planetMaterial);

          // Position the planet so only its top curved surface is visible
          // This creates the horizon effect
          planet.position.set(
            0,
            -planetRadius + viewportPercentToWorldY(20) - 30,
            -1000
          );

          scene.add(planet);

          return { planet };
        };

        const planetarySurface = createPlanetarySurface();

        // Create base fog layer - continuous planetary cloud base
        const createBaseFogLayer = () => {
          // Create a large curved plane for the cloud layer
          const fogPlaneRadius = 5000;
          const fogPlaneGeometry = new THREE.CircleGeometry(fogPlaneRadius, 64);

          const fogPlaneMaterial = new THREE.MeshStandardMaterial({
            color: 0xccccff,
            transparent: true,
            opacity: 0.8,
            roughness: 0.7,
            metalness: 0.1,
            side: THREE.DoubleSide,
          });

          const fogPlane = new THREE.Mesh(fogPlaneGeometry, fogPlaneMaterial);

          // Position the cloud layer just above the planet surface
          fogPlane.position.set(0, viewportPercentToWorldY(20) - 25, -1000);

          // Rotate to face the camera
          fogPlane.rotation.x = -Math.PI / 2;

          scene.add(fogPlane);

          return { fogPlane };
        };

        const baseFogLayer = createBaseFogLayer();

        // Create foreground cloud layer (bottom 20% of viewport)
        const createForegroundCloudLayer = () => {
          const foregroundY = viewportPercentToWorldY(20);
          const puffs = [];
          const puffCount = 150;

          for (let i = 0; i < puffCount; i++) {
            // Scaled down cloud sizes
            const puffSize = Math.random() * 70 + 130;
            const puffGeometry = new THREE.SphereGeometry(puffSize, 8, 8);
            const puffOpacity = Math.random() * 0.2 + 0.2;
            const puffMaterial = new THREE.MeshStandardMaterial({
              color: 0xbb88cc,
              transparent: true,
              opacity: puffOpacity,
              roughness: 0.6,
            });

            const puff = new THREE.Mesh(puffGeometry, puffMaterial);
            const radius = 1200 + Math.random() * 1800;
            const angle = Math.random() * Math.PI * 2;
            const puffX = Math.cos(angle) * radius;
            const puffY = foregroundY + Math.random() * 30;
            const puffZ = Math.sin(angle) * radius - 800;

            puff.position.set(puffX, puffY, puffZ);
            // Add lifecycle properties
            puff.userData = {
              initialY: puffY,
              originalOpacity: puffOpacity,
              state: "alive", // States: "alive", "fading"
              fadeProgress: 0,
              lifespan: 300 + Math.random() * 400, // Longer lifespan
              age: Math.random() * 200, // Start at different ages
            };
            scene.add(puff);
            puffs.push(puff);
          }

          return { puffs, yPosition: foregroundY };
        };

        // Create midground cloud layer (20-30% from bottom of viewport)
        const createMidgroundCloudLayer = () => {
          const midgroundY = viewportPercentToWorldY(25);
          const puffs = [];
          const puffCount = 100;

          for (let i = 0; i < puffCount; i++) {
            // Scaled down cloud sizes
            const puffSize = Math.random() * 70 + 70;
            const puffGeometry = new THREE.SphereGeometry(puffSize, 8, 8);
            const puffOpacity = Math.random() * 0.2 + 0.4;
            const puffMaterial = new THREE.MeshStandardMaterial({
              color: 0xddaade,
              transparent: true,
              opacity: puffOpacity,
              roughness: 0.7,
            });

            const puff = new THREE.Mesh(puffGeometry, puffMaterial);
            const radius = 1000 + Math.random() * 1400;
            const angle = Math.random() * Math.PI * 2;
            const puffX = Math.cos(angle) * radius;
            const puffY = midgroundY + Math.random() * 20 - 10;
            const puffZ = Math.sin(angle) * radius - 1200;

            puff.position.set(puffX, puffY, puffZ);
            // Add lifecycle properties
            puff.userData = {
              initialY: puffY,
              minY: viewportPercentToWorldY(20),
              maxY: viewportPercentToWorldY(30),
              originalOpacity: puffOpacity,
              state: "alive", // States: "alive", "fading"
              fadeProgress: 0,
              lifespan: 400 + Math.random() * 500, // Longer lifespan
              age: Math.random() * 250, // Start at different ages
            };
            scene.add(puff);
            puffs.push(puff);
          }

          return { puffs, yPosition: midgroundY };
        };

        // Create horizon cloud layer (55% from bottom of viewport)
        const createHorizonCloudLayer = () => {
          const horizonY = viewportPercentToWorldY(55);
          const puffs = [];
          const puffCount = 60;

          for (let i = 0; i < puffCount; i++) {
            // Scaled down cloud sizes
            const puffSize = Math.random() * 35 + 35;
            const puffGeometry = new THREE.SphereGeometry(puffSize, 8, 8);
            const puffOpacity = Math.random() * 0.2 + 0.6;
            const puffMaterial = new THREE.MeshStandardMaterial({
              color: 0xeeccee,
              transparent: true,
              opacity: puffOpacity,
              roughness: 0.7,
            });

            const puff = new THREE.Mesh(puffGeometry, puffMaterial);
            const radius = 800 + Math.random() * 1200;
            const angle = Math.random() * Math.PI * 2;
            const puffX = Math.cos(angle) * radius;
            const puffY = horizonY + Math.random() * 10 - 5;
            const puffZ = Math.sin(angle) * radius - 2000;

            puff.position.set(puffX, puffY, puffZ);
            // Add lifecycle properties
            puff.userData = {
              initialY: puffY,
              originalOpacity: puffOpacity,
              state: "alive", // States: "alive", "fading"
              fadeProgress: 0,
              lifespan: 500 + Math.random() * 600, // Longer lifespan
              age: Math.random() * 300, // Start at different ages
            };
            scene.add(puff);
            puffs.push(puff);
          }

          return { puffs, yPosition: horizonY };
        };

        // Function to spawn a new cloud puff
        const spawnNewPuff = (layer, puff) => {
          // Reset all properties for a new life cycle
          const material = puff.material;

          // Reset opacity to original value
          material.opacity = puff.userData.originalOpacity;

          // Reset position based on layer
          let radius, angle, y;

          if (layer === "foreground") {
            radius = 1200 + Math.random() * 1800;
            angle = Math.random() * Math.PI * 2;
            y = foregroundClouds.yPosition + Math.random() * 30;
            puff.position.set(
              Math.cos(angle) * radius,
              y,
              Math.sin(angle) * radius - 800
            );
          } else if (layer === "midground") {
            radius = 1000 + Math.random() * 1400;
            angle = Math.random() * Math.PI * 2;
            y = midgroundClouds.yPosition + Math.random() * 20 - 10;
            puff.position.set(
              Math.cos(angle) * radius,
              y,
              Math.sin(angle) * radius - 1200
            );
          } else if (layer === "horizon") {
            radius = 800 + Math.random() * 1200;
            angle = Math.random() * Math.PI * 2;
            y = horizonClouds.yPosition + Math.random() * 10 - 5;
            puff.position.set(
              Math.cos(angle) * radius,
              y,
              Math.sin(angle) * radius - 2000
            );
          }

          // Reset lifecycle
          puff.userData.initialY = y;
          puff.userData.state = "alive";
          puff.userData.fadeProgress = 0;
          puff.userData.age = 0;
        };

        // Create cloud layers
        const foregroundClouds = createForegroundCloudLayer();
        const midgroundClouds = createMidgroundCloudLayer();
        const horizonClouds = createHorizonCloudLayer();

        // Resize handler
        const handleResize = () => {
          const width = window.innerWidth;
          const height = window.innerHeight;
          renderer.setSize(width, height);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        };

        window.addEventListener("resize", handleResize);

        // Animation
        let time = 0;
        const animate = () => {
          requestAnimationFrame(animate);

          time += 0.003;

          stars.rotation.y += 0.0001;

          const glowScale = 1 + Math.sin(time * 0.5) * 0.1;
          moonObj.moonGlow.scale.set(glowScale, glowScale, glowScale);

          // Animate planetary surface and base fog layer
          if (planetarySurface.planet) {
            planetarySurface.planet.rotation.z = Math.sin(time * 0.05) * 0.01;
          }

          if (baseFogLayer.fogPlane) {
            baseFogLayer.fogPlane.position.y += Math.sin(time * 0.1) * 0.05;
            baseFogLayer.fogPlane.rotation.z = Math.sin(time * 0.05) * 0.01;
          }

          // Foreground cloud layer animation - fastest movement
          foregroundClouds.puffs.forEach((puff, index) => {
            // Only animate if not completely faded out
            if (puff.userData.state !== "gone") {
              const angleOffset = time * 0.1 + index * 0.01;
              puff.position.x += Math.sin(angleOffset) * 0.5;
              puff.position.z += Math.cos(angleOffset) * 0.5;
              puff.position.y += Math.sin(time * 0.3 + index * 0.05) * 0.2;

              // Increment age
              puff.userData.age += 1;

              // Check if cloud should start fading
              if (
                puff.userData.state === "alive" &&
                puff.userData.age >= puff.userData.lifespan
              ) {
                puff.userData.state = "fading";
              }

              // Handle fading state
              if (puff.userData.state === "fading") {
                puff.userData.fadeProgress += 0.01;
                puff.material.opacity =
                  puff.userData.originalOpacity *
                  (1 - puff.userData.fadeProgress);

                // When fully faded, spawn a new cloud
                if (puff.userData.fadeProgress >= 1) {
                  spawnNewPuff("foreground", puff);
                }
              }

              // Check if cloud is too far from center (alternative trigger for fading)
              const distanceFromCenter = Math.sqrt(
                puff.position.x * puff.position.x +
                  puff.position.z * puff.position.z
              );

              if (
                distanceFromCenter > 4000 ||
                Math.abs(puff.position.y - puff.userData.initialY) > 50
              ) {
                if (puff.userData.state === "alive") {
                  puff.userData.state = "fading";
                }
              }
            }
          });

          // Midground cloud layer animation - medium speed
          midgroundClouds.puffs.forEach((puff, index) => {
            // Only animate if not completely faded out
            if (puff.userData.state !== "gone") {
              const angleOffset = time * 0.06 + index * 0.02;
              puff.position.x += Math.sin(angleOffset) * 0.3;
              puff.position.z += Math.cos(angleOffset) * 0.3;
              puff.position.y += Math.sin(time * 0.2 + index * 0.05) * 0.15;

              // Increment age
              puff.userData.age += 1;

              // Check if cloud should start fading
              if (
                puff.userData.state === "alive" &&
                puff.userData.age >= puff.userData.lifespan
              ) {
                puff.userData.state = "fading";
              }

              // Handle fading state
              if (puff.userData.state === "fading") {
                puff.userData.fadeProgress += 0.008; // Slightly slower fade for midground
                puff.material.opacity =
                  puff.userData.originalOpacity *
                  (1 - puff.userData.fadeProgress);

                // When fully faded, spawn a new cloud
                if (puff.userData.fadeProgress >= 1) {
                  spawnNewPuff("midground", puff);
                }
              }

              // Check if cloud is too far from center or outside Y bounds
              const distanceFromCenter = Math.sqrt(
                puff.position.x * puff.position.x +
                  puff.position.z * puff.position.z
              );

              if (
                distanceFromCenter > 3500 ||
                puff.position.y < puff.userData.minY ||
                puff.position.y > puff.userData.maxY
              ) {
                if (puff.userData.state === "alive") {
                  puff.userData.state = "fading";
                }
              }
            }
          });

          // Horizon cloud layer animation - slowest movement
          horizonClouds.puffs.forEach((puff, index) => {
            // Only animate if not completely faded out
            if (puff.userData.state !== "gone") {
              const angleOffset = time * 0.03 + index * 0.01;
              puff.position.x += Math.sin(angleOffset) * 0.1;
              puff.position.z += Math.cos(angleOffset) * 0.1;
              puff.position.y += Math.sin(time * 0.1 + index * 0.03) * 0.05;

              // Increment age
              puff.userData.age += 1;

              // Check if cloud should start fading
              if (
                puff.userData.state === "alive" &&
                puff.userData.age >= puff.userData.lifespan
              ) {
                puff.userData.state = "fading";
              }

              // Handle fading state
              if (puff.userData.state === "fading") {
                puff.userData.fadeProgress += 0.005; // Slowest fade for horizon
                puff.material.opacity =
                  puff.userData.originalOpacity *
                  (1 - puff.userData.fadeProgress);

                // When fully faded, spawn a new cloud
                if (puff.userData.fadeProgress >= 1) {
                  spawnNewPuff("horizon", puff);
                }
              }

              // Check if cloud is too far from center
              const distanceFromCenter = Math.sqrt(
                puff.position.x * puff.position.x +
                  puff.position.z * puff.position.z
              );

              if (
                distanceFromCenter > 3000 ||
                Math.abs(puff.position.y - puff.userData.initialY) > 20
              ) {
                if (puff.userData.state === "alive") {
                  puff.userData.state = "fading";
                }
              }
            }
          });

          renderer.render(scene, camera);
        };

        animate();

        // Cleanup
        return () => {
          window.removeEventListener("resize", handleResize);
          renderer.domElement.remove();
        };
      });
    </script>
  </body>
</html>
