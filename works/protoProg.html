      // ========================================================

      /**
       * Checks for completed structures within a small radius of a position.
       * Used to determine if a new site should become a Flag (0 neighbors) or Building (1+ neighbors).
       * @param {THREE.Vector3} position - The position to check around.
       * @returns {number} The count of nearby completed structures.
       */
      function checkNeighbors(position) {
        let neighborCount = 0;
        const checkRadiusSq = neighborCheckRadius * neighborCheckRadius; // Use squared distance

        // Check against completed structures in the obstacles array
        for (const obstacle of obstacles) {
          if (
            obstacle?.parent &&
            obstacle.userData.isObstacle &&
            (obstacle.userData.isFlag ||
              obstacle.userData.isBuilding ||
              obstacle.userData.isHouse)
          ) {
            // Only check Flags, Buildings, Houses
            if (position.distanceToSquared(obstacle.position) < checkRadiusSq) {
              neighborCount++;
            }
          }
        }
        console.log(
          `[DEBUG] Small Radius Neighbor check at (${position.x.toFixed(
            1
          )}, ${position.z.toFixed(
            1
          )}) found ${neighborCount} completed neighbors`
        );
        return neighborCount;
      }

      /**
       * Updates the build progress of construction sites when the player is nearby.
       * Handles site completion, converting them into final structures (Flag, Building, Wall, House).
       * Includes player collision check and push-out logic upon structure completion.
       */
      function updateConstructionSites() {
        const buildProximityRadiusSq =
          buildProximityRadius * buildProximityRadius; // Squared radius

        for (let i = constructionSites.length - 1; i >= 0; i--) {
          const site = constructionSites[i];
          // Cleanup check: Remove site from array if it no longer exists in scene
          if (!site?.parent) {
            removeRangeIndicator(site?.uuid); // Use optional chaining
            constructionSites.splice(i, 1);
            continue;
          }

          const distSq = player.position.distanceToSquared(site.position);
          const indicatorData = rangeIndicators[site.uuid];

          // --- Build Progress ---
          if (distSq <= buildProximityRadiusSq) {
            // Player is within build range
            // Check if site was destroyed while player was nearby
            if (site.userData.hp <= 0) {
              console.log(`[DEBUG] Site ${site.uuid} destroyed during build`);
              removeRangeIndicator(site.uuid);
              scene.remove(site);
              constructionSites.splice(i, 1);
              continue;
            }

            // Increment build timer and update scale/position
            site.userData.buildTimer++;
            const progress = Math.min(
              1.0,
              site.userData.buildTimer / site.userData.buildDuration
            );
            site.scale.y = THREE.MathUtils.lerp(0.01, 1.0, progress); // Interpolate scale
            site.position.y = (site.userData.finalHeight * site.scale.y) / 2; // Adjust height based on scale

            // Update indicator appearance
            if (indicatorData?.mesh) {
              indicatorData.mesh.visible = true;
              indicatorData.mesh.material = rangeIndicatorActiveMat; // Set to active color
            }

            // --- Site Completion ---
            if (progress >= 1.0) {
              console.log(
                `[DEBUG] Site ${
                  site.uuid
                } completed at (${site.position.x.toFixed(
                  1
                )}, ${site.position.z.toFixed(1)})`
              );
              const sitePosition = site.position.clone();
              const siteUUID = site.uuid;
              const connections = site.userData.connections || []; // Get stored potential connections

              // Find all connected *completed* structures and the current site
              const connectedSitesAndStructures = [
                {
                  uuid: siteUUID,
                  position: sitePosition,
                  object: site,
                  isSite: true,
                }, // Mark the completing site
              ];
              // Check obstacles for completed structures
              obstacles.forEach((obs) => {
                if (
                  obs?.parent &&
                  obs.userData.isObstacle &&
                  (obs.userData.isFlag ||
                    obs.userData.isBuilding ||
                    obs.userData.isHouse) &&
                  connections.includes(obs.uuid)
                ) {
                  connectedSitesAndStructures.push({
                    uuid: obs.uuid,
                    position: obs.position.clone(),
                    object: obs,
                    isSite: false,
                  });
                }
              });
              // Check other construction sites (less common case, but possible)
              constructionSites.forEach((otherSite) => {
                if (
                  otherSite?.parent &&
                  otherSite.uuid !== siteUUID &&
                  connections.includes(otherSite.uuid)
                ) {
                  // Only connect if the *other* site is already fully built (progress >= 1) - unlikely but prevents race conditions
                  if (
                    otherSite.userData.buildTimer /
                      otherSite.userData.buildDuration >=
                    1.0
                  ) {
                    // This case is complex - ideally handled by the other site's completion logic.
                    // For simplicity, we might ignore connecting to other *in-progress* sites here.
                    // Let's assume for now connections only form with already completed structures (Flags/Buildings/Houses in obstacles array).
                  }
                }
              });

              let finalStructure = null;
              let structureType = null;
              let structureHP = 0;
              let createdHouse = false;

              // --- House Formation Check ---
              // Need at least 3 connected points (current site + 2 others)
              if (connectedSitesAndStructures.length >= 3) {
                // Try all combinations of 3 points involving the current site
                for (let j = 0; j < connectedSitesAndStructures.length; j++) {
                  if (connectedSitesAndStructures[j].isSite) continue; // Skip the current site itself as 'B'
                  for (
                    let k = j + 1;
                    k < connectedSitesAndStructures.length;
                    k++
                  ) {
                    if (connectedSitesAndStructures[k].isSite) continue; // Skip the current site itself as 'C'

                    const posA = sitePosition; // The completing site
                    const posB = connectedSitesAndStructures[j].position;
                    const posC = connectedSitesAndStructures[k].position;

                    if (canFormHouse(posA, posB, posC, buildProximityRadius)) {
                      console.log("[DEBUG] House formation conditions met!");
                      finalStructure = createHouseMesh([posA, posB, posC]);
                      structureType = StructureType.HOUSE;
                      structureHP = 300;
                      createdHouse = true;

                      // Remove the 3 base objects (the site and the two connected structures)
                      const objectsToRemove = [
                        site,
                        connectedSitesAndStructures[j].object,
                        connectedSitesAndStructures[k].object,
                      ];
                      objectsToRemove.forEach((objToRemove) => {
                        if (objToRemove.userData.isConstructionSite) {
                          const idx = constructionSites.findIndex(
                            (s) => s.uuid === objToRemove.uuid
                          );
                          if (idx > -1) constructionSites.splice(idx, 1);
                          removeRangeIndicator(objToRemove.uuid);
                          scene.remove(objToRemove);
                        } else {
                          // It's a structure from the obstacles array
                          const idx = obstacles.findIndex(
                            (o) => o.uuid === objToRemove.uuid
                          );
                          if (idx > -1) obstacles.splice(idx, 1);
                          if (objToRemove.userData.indicatorUUID)
                            removeRangeIndicator(
                              objToRemove.userData.indicatorUUID
                            );
                          scene.remove(objToRemove);
                        }
                      });
                      break; // House created, stop checking combinations
                    }
                  }
                  if (createdHouse) break; // House created, stop checking combinations
                }
              }

              // --- Single Structure/Wall Formation ---
              if (!createdHouse) {
                const neighborCount = checkNeighbors(sitePosition); // Check *small* radius for adjacent completed structures
                console.log(
                  `[DEBUG] Site completion neighbor count (small radius): ${neighborCount}`
                );

                if (neighborCount === 0) {
                  // Becomes a Flag if no immediate neighbors
                  finalStructure = createFlagMesh();
                  structureType = StructureType.FLAG;
                  structureHP = 50;
                  finalStructure.position.copy(sitePosition);
                  finalStructure.position.y = 0; // Flag base on ground
                } else {
                  // Becomes a Building if it has immediate neighbors
                  structureType = StructureType.BUILDING;
                  structureHP = 200;
                  finalStructure = new THREE.Mesh(
                    baseStructureGeo,
                    buildingMat.clone()
                  );
                  finalStructure.position.copy(sitePosition);
                  finalStructure.position.y =
                    baseStructureGeo.parameters.height / 2; // Center building vertically
                }

                // Create connecting walls to *all* structures within the larger buildProximityRadius
                connections.forEach((uuid) => {
                  const neighbor = scene.getObjectByProperty("uuid", uuid);
                  // Ensure neighbor exists, is in scene, and is not the structure we just created
                  if (
                    neighbor &&
                    neighbor.parent &&
                    neighbor.uuid !== finalStructure?.uuid
                  ) {
                    // Check if neighbor is a completed structure (Flag/Building/House) or another completed site
                    const isCompletedStructure =
                      neighbor.userData.isObstacle &&
                      (neighbor.userData.isFlag ||
                        neighbor.userData.isBuilding ||
                        neighbor.userData.isHouse);
                    const isCompletedSite =
                      neighbor.userData.isConstructionSite &&
                      neighbor.userData.buildTimer /
                        neighbor.userData.buildDuration >=
                        1.0;

                    if (isCompletedStructure || isCompletedSite) {
                      createFinalWall(sitePosition, neighbor.position); // Use sitePosition before it's removed
                    }
                  }
                });

                // Remove the original construction site
                scene.remove(site);
                constructionSites.splice(i, 1); // Remove from active sites array
                removeRangeIndicator(siteUUID); // Remove its indicator
              }

              // --- Finalize Structure ---
              if (finalStructure) {
                finalStructure.castShadow = true;
                finalStructure.receiveShadow = true;
                finalStructure.userData = {
                  ...finalStructure.userData, // Keep existing data like isHouse etc.
                  isObstacle: true,
                  structureType,
                  isFlag: structureType === StructureType.FLAG,
                  isWall: false, // Walls are added separately
                  isBuilding: structureType === StructureType.BUILDING,
                  // isHouse is set in createHouseMesh
                  hp: structureHP,
                  maxHp: structureHP,
                };
                // Add indicator UUID if it's not a house (houses handle their own indicator)
                if (structureType !== StructureType.HOUSE) {
                  const indicator = new THREE.Mesh(
                    rangeIndicatorGeo,
                    rangeIndicatorCompletedMat.clone()
                  );
                  indicator.position.copy(finalStructure.position);
                  indicator.position.y = 0.05;
                  indicator.rotation.x = -Math.PI / 2;
                  indicator.visible = false; // Keep hidden by default for completed structures
                  scene.add(indicator);
                  rangeIndicators[finalStructure.uuid] = { mesh: indicator };
                  finalStructure.userData.indicatorUUID = finalStructure.uuid;
                }

                scene.add(finalStructure);
                obstacles.push(finalStructure); // Add the new structure to obstacles array

                // --- Player Collision Check on Completion ---
                player.userData.boundingBox.setFromObject(player); // Update player box
                const structureBox = new THREE.Box3().setFromObject(
                  finalStructure
                );
                if (player.userData.boundingBox.intersectsBox(structureBox)) {
                  console.log(
                    `[DEBUG] Player collision detected with completed ${structureType}`
                  );
                  pushPlayerOutOfObstacle(finalStructure); // Push player out
                }
                // --- End Player Collision Check ---

                if (buildCompleteSynth)
                  buildCompleteSynth.triggerAttackRelease("C5", "16n"); // Play completion sound
                createParticles(sitePosition, 15, 0xffffff, 0.06, 50); // Completion particles

                // No 'continue' needed here if house wasn't created, as the site was already removed.
                // If house *was* created, the site was removed inside the house logic.
              } else {
                // This case should ideally not happen if logic is correct
                console.error(
                  `[ERROR] Site ${siteUUID} completed but no final structure was created.`
                );
                // Force removal of the site to prevent issues
                scene.remove(site);
                constructionSites.splice(i, 1);
                removeRangeIndicator(siteUUID);
              }
            } // End if (progress >= 1.0)
          } // End if (player in range)
          // Hide indicator if player is out of range and not previewing
          else if (indicatorData?.mesh && !isPreviewingBuild) {
            indicatorData.mesh.visible = false;
            // Could optionally reset build timer here if desired
            // site.userData.buildTimer = 0;
            // site.scale.y = 0.01;
            // site.position.y = (site.userData.finalHeight * site.scale.y) / 2;
          }
        } // End loop through construction sites
      }

      /**
       * Removes a range indicator mesh from the scene and cleans up resources.
       * @param {string | undefined} objectUUID - The UUID of the object whose indicator should be removed.
       */
      function removeRangeIndicator(objectUUID) {
        if (!objectUUID) return;
        const indicatorData = rangeIndicators[objectUUID];
        if (indicatorData?.mesh) {
          console.log(`[DEBUG] Removing indicator for object ${objectUUID}`);
          scene.remove(indicatorData.mesh);
          // Dispose geometry and material to free memory
          if (indicatorData.mesh.geometry)
            indicatorData.mesh.geometry.dispose();
          if (indicatorData.mesh.material)
            indicatorData.mesh.material.dispose();
        }
        delete rangeIndicators[objectUUID]; // Remove from the tracking object
      }

      /**
       * Updates the visibility and material of range indicators based on build preview state.
       * Shows indicators for nearby sites and completed structures when previewing.
       * @param {THREE.Vector3 | null} previewPosition - The current position of the build preview ghost, or null if not previewing.
       */
      function updatePreviewIndicators(previewPosition) {
        // Hide all indicators initially
        for (const uuid in rangeIndicators) {
          if (rangeIndicators[uuid]?.mesh) {
            rangeIndicators[uuid].mesh.visible = false;
          }
        }

        if (!previewPosition) return; // Exit if not previewing

        const indicatorShowRadiusSq = indicatorShowRadius * indicatorShowRadius; // Squared radius

        // Show indicators for nearby construction sites
        constructionSites.forEach((site) => {
          if (!site?.parent) return;
          if (
            site.position.distanceToSquared(previewPosition) <=
            indicatorShowRadiusSq
          ) {
            const indicatorData = rangeIndicators[site.uuid];
            if (indicatorData?.mesh) {
              indicatorData.mesh.visible = true;
              indicatorData.mesh.material = rangeIndicatorMat; // Use default yellow material
            }
          }
        });

        // Show indicators for nearby completed structures (Flags, Buildings, Houses)
        obstacles.forEach((obstacle) => {
          if (!obstacle?.parent) return;
          // Check if it's a structure with an indicator UUID
          if (obstacle.userData.isObstacle && obstacle.userData.indicatorUUID) {
            if (
              obstacle.position.distanceToSquared(previewPosition) <=
              indicatorShowRadiusSq
            ) {
              const indicatorData =
                rangeIndicators[obstacle.userData.indicatorUUID];
              if (indicatorData?.mesh) {
                indicatorData.mesh.visible = true;
                // Use completed material for already built structures
                indicatorData.mesh.material = rangeIndicatorCompletedMat;
              }
            }
          }
        });
      }

      /**
       * Creates the start portal if arriving via portal parameter
       */
      function createStartPortal() {
        if (!new URLSearchParams(window.location.search).get("portal")) return;

        const startPortalGroup = new THREE.Group();
        startPortalGroup.position.set(
          SPAWN_POINT_X,
          SPAWN_POINT_Y,
          SPAWN_POINT_Z
        );
        startPortalGroup.rotation.x = 0.35;

        // Portal ring
        const startPortalGeometry = new THREE.TorusGeometry(15, 2, 16, 100);
        const startPortalMaterial = new THREE.MeshPhongMaterial({
          color: 0xff0000,
          emissive: 0xff0000,
          transparent: true,
          opacity: 0.8,
        });
        const startPortal = new THREE.Mesh(
          startPortalGeometry,
          startPortalMaterial
        );
        startPortalGroup.add(startPortal);

        // Inner surface
        const startPortalInnerGeometry = new THREE.CircleGeometry(13, 32);
        const startPortalInnerMaterial = new THREE.MeshBasicMaterial({
          color: 0xff0000,
          transparent: true,
          opacity: 0.5,
          side: THREE.DoubleSide,
        });
        const startPortalInner = new THREE.Mesh(
          startPortalInnerGeometry,
          startPortalInnerMaterial
        );
        startPortalGroup.add(startPortalInner);

        // Particle effects
        const particleCount = 1000;
        const particles = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
          const angle = Math.random() * Math.PI * 2;
          const radius = 15 + (Math.random() - 0.5) * 4;
          positions[i] = Math.cos(angle) * radius;
          positions[i + 1] = Math.sin(angle) * radius;
          positions[i + 2] = (Math.random() - 0.5) * 4;
          colors[i] = 0.8 + Math.random() * 0.2; // Red variations
          colors[i + 1] = 0;
          colors[i + 2] = 0;
        }

        particles.setAttribute(
          "position",
          new THREE.BufferAttribute(positions, 3)
        );
        particles.setAttribute("color", new THREE.BufferAttribute(colors, 3));
        const particleMaterial = new THREE.PointsMaterial({
          size: 0.2,
          vertexColors: true,
          transparent: true,
          opacity: 0.6,
        });
        const particleSystem = new THREE.Points(particles, particleMaterial);
        startPortalGroup.add(particleSystem);

        scene.add(startPortalGroup);
        startPortalBox = new THREE.Box3().setFromObject(startPortalGroup);

        function animateStartPortal() {
          const posArray = particles.attributes.position.array;
          for (let i = 0; i < posArray.length; i += 3) {
            posArray[i + 1] += 0.05 * Math.sin(Date.now() * 0.001 + i);
          }
          particles.attributes.position.needsUpdate = true;
          requestAnimationFrame(animateStartPortal);
        }
        animateStartPortal();
      }

      /**
       * Creates the exit portal
       */
      function createExitPortal() {
        const exitPortalGroup = new THREE.Group();
        exitPortalGroup.position.set(
          EXIT_PORTAL_X,
          EXIT_PORTAL_Y,
          EXIT_PORTAL_Z
        );
        exitPortalGroup.rotation.x = 0.35;

        // Portal ring
        const exitPortalGeometry = new THREE.TorusGeometry(15, 2, 16, 100);
        const exitPortalMaterial = new THREE.MeshPhongMaterial({
          color: 0x00ff00,
          emissive: 0x00ff00,
          transparent: true,
          opacity: 0.8,
        });
        const exitPortal = new THREE.Mesh(
          exitPortalGeometry,
          exitPortalMaterial
        );
        exitPortalGroup.add(exitPortal);

        // Inner surface
        const exitPortalInnerGeometry = new THREE.CircleGeometry(13, 32);
        const exitPortalInnerMaterial = new THREE.MeshBasicMaterial({
          color: 0x00ff00,
          transparent: true,
          opacity: 0.5,
          side: THREE.DoubleSide,
        });
        const exitPortalInner = new THREE.Mesh(
          exitPortalInnerGeometry,
          exitPortalInnerMaterial
        );
        exitPortalGroup.add(exitPortalInner);

        // Label
        const loader = new THREE.TextureLoader();
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        canvas.width = 512;
        canvas.height = 64;
        context.fillStyle = "#00ff00";
        context.font = "bold 32px Arial";
        context.textAlign = "center";
        context.fillText(
          "VIBEVERSE PORTAL",
          canvas.width / 2,
          canvas.height / 2
        );
        const texture = new THREE.CanvasTexture(canvas);
        const labelGeometry = new THREE.PlaneGeometry(30, 5);
        const labelMaterial = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          side: THREE.DoubleSide,
        });
        const label = new THREE.Mesh(labelGeometry, labelMaterial);
        label.position.y = 20;
        exitPortalGroup.add(label);

        // Particle effects
        const particleCount = 1000;
        const particles = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
          const angle = Math.random() * Math.PI * 2;
          const radius = 15 + (Math.random() - 0.5) * 4;
          positions[i] = Math.cos(angle) * radius;
          positions[i + 1] = Math.sin(angle) * radius;
          positions[i + 2] = (Math.random() - 0.5) * 4;
          colors[i] = 0;
          colors[i + 1] = 0.8 + Math.random() * 0.2; // Green variations
          colors[i + 2] = 0;
        }

        particles.setAttribute(
          "position",
          new THREE.BufferAttribute(positions, 3)
        );
        particles.setAttribute("color", new THREE.BufferAttribute(colors, 3));
        const particleMaterial = new THREE.PointsMaterial({
          size: 0.2,
          vertexColors: true,
          transparent: true,
          opacity: 0.6,
        });
        const particleSystem = new THREE.Points(particles, particleMaterial);
        exitPortalGroup.add(particleSystem);

        scene.add(exitPortalGroup);
        exitPortalBox = new THREE.Box3().setFromObject(exitPortalGroup);

        function animateExitPortal() {
          const posArray = particles.attributes.position.array;
          for (let i = 0; i < posArray.length; i += 3) {
            posArray[i + 1] += 0.05 * Math.sin(Date.now() * 0.001 + i);
          }
          particles.attributes.position.needsUpdate = true;
          requestAnimationFrame(animateExitPortal);
        }
        animateExitPortal();
      }

      /**
       * Updates the preview wall meshes based on the ghost position and nearby objects.
       * @param {THREE.Vector3 | null} ghostPosition - The current position of the build preview ghost.
       * @param {THREE.Object3D[]} nearbyObjects - Array of nearby sites/structures the ghost could connect to.
       */
      function updateWallPreviews(ghostPosition, nearbyObjects) {
        // Ensure preview wall pool is filled
        while (previewWalls.length < MAX_PREVIEW_WALLS) {
          const wallGeo = new THREE.BoxGeometry(wallThickness, wallHeight, 1); // Placeholder geometry
          const previewWallMesh = new THREE.Mesh(wallGeo, wallPreviewMat);
          previewWallMesh.visible = false;
          scene.add(previewWallMesh);
          previewWalls.push(previewWallMesh);
        }

        // Hide all preview walls initially
        for (let i = 0; i < previewWalls.length; i++) {
          previewWalls[i].visible = false;
        }

        // Exit if not previewing or no nearby objects
        if (!ghostPosition || !nearbyObjects || nearbyObjects.length === 0) {
          return;
        }

        let wallIndex = 0; // Index for reusing preview wall meshes
        nearbyObjects.forEach((neighbor) => {
          if (wallIndex >= MAX_PREVIEW_WALLS) {
            console.warn("Max preview walls reached.");
            return; // Stop if pool is exhausted
          }
          if (!neighbor || !neighbor.parent) return; // Skip invalid neighbors

          const wallMesh = previewWalls[wallIndex];
          const neighborPos = neighbor.position;
          const distance = ghostPosition.distanceTo(neighborPos);

          if (distance < 0.1) return; // Skip zero-length walls

          // Update geometry, position, and rotation of the preview wall mesh
          if (wallMesh.geometry) wallMesh.geometry.dispose(); // Dispose old geometry
          wallMesh.geometry = new THREE.BoxGeometry(
            wallThickness,
            wallHeight,
            distance
          ); // Create new geometry
          const midPoint = new THREE.Vector3()
            .addVectors(ghostPosition, neighborPos)
            .multiplyScalar(0.5);
          wallMesh.position.copy(midPoint);
          wallMesh.position.y = wallHeight / 2;
          const angle = Math.atan2(
            ghostPosition.x - neighborPos.x,
            ghostPosition.z - neighborPos.z
          );
          wallMesh.rotation.y = angle;
          wallMesh.visible = true; // Make the wall visible
          wallIndex++; // Move to the next wall in the pool
        });
      }

      // ========================================================
      // ========== GAME LOOP (animate) =========================
      // ========================================================

      /**
       * The main game loop function, called recursively via requestAnimationFrame.
       */
      /**
       * The main game loop function, called recursively via requestAnimationFrame.
       */
      function animate() {
        requestAnimationFrame(animate); // Schedule next frame
        const deltaTime = clock.getDelta(); // Get time since last frame (not used currently, but good practice)

        // --- Update Build Preview ---
        let nearbyObjectsForPreview = [];
        if (isPreviewingBuild) {
          const placeDistance = 2.0; // How far in front of player to preview
          const forward = new THREE.Vector3();
          // Get player's forward direction (horizontal only)
          // Use camera direction for FP, calculated direction for TP
          if (zoomLevel <= 0) {
            camera.getWorldDirection(forward);
          } else {
            forward.set(Math.sin(tpYaw), 0, Math.cos(tpYaw)).negate(); // Use TP yaw, negate to point away from camera
          }
          forward.y = 0;
          forward.normalize();

          const placePos = player.position
            .clone()
            .addScaledVector(forward, placeDistance); // Calculate preview position

          // Determine ghost type (Flag or Building) based on small radius neighbors
          const previewNeighborCount = checkNeighbors(placePos);
          if (previewNeighborCount === 0) {
            // Show Flag ghost
            if (ghostMesh.geometry !== flagPoleGeo) {
              // Change geometry/material only if needed
              ghostMesh.material = ghostFlagMat;
              ghostMesh.geometry.dispose(); // Dispose old geometry
              ghostMesh.geometry = flagPoleGeo;
            }
            ghostMesh.position.y = flagPoleGeo.parameters.height / 2;
          } else {
            // Show Building ghost
            if (ghostMesh.geometry !== baseStructureGeo) {
              // Change geometry/material only if needed
              ghostMesh.material = ghostBuildingMat;
              ghostMesh.geometry.dispose(); // Dispose old geometry
              ghostMesh.geometry = baseStructureGeo;
            }
            ghostMesh.position.y = baseStructureGeo.parameters.height / 2;
          }
          ghostMesh.position.copy(placePos); // Set ghost position
          ghostMesh.position.y = ghostMesh.geometry.parameters.height / 2; // Adjust height based on current geometry
          ghostMesh.visible = true;

          // Find nearby objects for wall previews and indicators
          const buildRadiusSq = buildProximityRadius * buildProximityRadius;
          // Check obstacles (completed structures)
          obstacles.forEach((obs) => {
            if (
              obs?.parent &&
              obs.userData.isObstacle &&
              (obs.userData.isFlag ||
                obs.userData.isBuilding ||
                obs.userData.isHouse)
            ) {
              if (
                ghostMesh.position.distanceToSquared(obs.position) <=
                buildRadiusSq
              ) {
                nearbyObjectsForPreview.push(obs);
              }
            }
          });
          // Check construction sites
          constructionSites.forEach((site) => {
            if (site?.parent) {
              if (
                ghostMesh.position.distanceToSquared(site.position) <=
                buildRadiusSq
              ) {
                nearbyObjectsForPreview.push(site);
              }
            }
          });

          // Update visual previews
          updateWallPreviews(ghostMesh.position, nearbyObjectsForPreview);
          updatePreviewIndicators(ghostMesh.position);
        } else {
          // Not previewing
          ghostMesh.visible = false;
          updateWallPreviews(null, []);
          updatePreviewIndicators(null);
        }
        // --- End Update Build Preview ---

        // --- Core Game Updates ---
        movePlayer(); // Handle player movement and collision (updates player bounding box)

        // --- Portal Collision Checks ---
        if (player.userData.hp > 0) {
          // Only check if player is alive
          const playerBox = player.userData.boundingBox;

          // Start Portal (return to previous game)
          if (
            startPortalBox &&
            new URLSearchParams(window.location.search).get("portal")
          ) {
            setTimeout(() => {
              const portalDistance = playerBox
                .getCenter(new THREE.Vector3())
                .distanceTo(startPortalBox.getCenter(new THREE.Vector3()));
              if (portalDistance < 50) {
                const urlParams = new URLSearchParams(window.location.search);
                const refUrl = urlParams.get("ref");
                if (refUrl) {
                  let url = refUrl.startsWith("http")
                    ? refUrl
                    : "https://" + refUrl;
                  const currentParams = new URLSearchParams(
                    window.location.search
                  );
                  const newParams = new URLSearchParams();
                  for (const [key, value] of currentParams) {
                    if (key !== "ref") {
                      newParams.append(key, value);
                    }
                  }
                  const paramString = newParams.toString();
                  window.location.href =
                    url + (paramString ? "?" + paramString : "");
                }
              }
            }, 5000); // 5-second delay before allowing return
          }

          // Exit Portal (go to next game)
          if (exitPortalBox) {
            const portalDistance = playerBox
              .getCenter(new THREE.Vector3())
              .distanceTo(exitPortalBox.getCenter(new THREE.Vector3()));
            if (portalDistance < 50) {
              const currentParams = new URLSearchParams(window.location.search);
              const newParams = new URLSearchParams();
              newParams.append("portal", "true");
              newParams.append("username", selfUsername);
              newParams.append("color", "blue"); // Matches player color 0x4a90e2
              newParams.append("speed", currentSpeed.toString());

              for (const [key, value] of currentParams) {
                newParams.append(key, value);
              }
              const paramString = newParams.toString();
              const nextPage =
                "https://portal.pieter.com" +
                (paramString ? "?" + paramString : "");

              if (
                !document.getElementById("preloadFrame") &&
                portalDistance < 50
              ) {
                const iframe = document.createElement("iframe");
                iframe.id = "preloadFrame";
                iframe.style.display = "none";
                iframe.src = nextPage;
                document.body.appendChild(iframe);
              }

              if (playerBox.intersectsBox(exitPortalBox)) {
                window.location.href = nextPage;
              }
            }
          }
        }
        // --- End Portal Collision Checks ---

        updateEnemies(); // Update enemy AI and movement (includes enemy collision)
        updateProjectiles(); // Update player projectiles
        updateEnemyProjectiles(); // Update enemy projectiles
        updateDonkey(); // Update donkey AI
        checkCollisions(); // Check projectile hits
        updateCamera(); // Update camera position/rotation
        updateUI(); // Update HTML UI display
        checkTutorialProgress(); // Check tutorial state
        updateParticles(); // Update particle effects
        updateConstructionSites(); // Update build progress and handle completion (includes player push-out)

        // --- Enemy Spawning (Post-Tutorial) ---
        if (tutorialPhase === 5 && player.userData.hp > 0) {
          // Only spawn after tutorial and if player alive
          spawnTimer++;
          const maxEnemies = 30; // Limit max enemies on screen
          if (spawnTimer > spawnInterval && enemies.length < maxEnemies) {
            spawnEnemy();
            spawnTimer = 0; // Reset timer
            // Decrease spawn interval over time (up to a minimum)
            if (spawnInterval > minSpawnInterval) {
              spawnInterval -= spawnIntervalDecrement;
            }
            spawnInterval = Math.max(spawnInterval, minSpawnInterval); // Ensure interval doesn't go below minimum
          }
        }

        // Render the scene
        renderer.render(scene, camera);
      }
      // ========================================================
      // ========== INITIALIZATION ==============================
      // ========================================================
      console.log("Game Initializing...");
      placeObstacles(); // Place initial trees and rocks
      updateWallPreviews(null, []); // Initialize wall preview mesh pool
      createStartPortal(); // Add start portal if arriving via portal
      createExitPortal(); // Always create exit portal
      updateCamera(); // Set initial camera position
      animate(); // Start the game loop
      console.log("Game Loop Started.");
    </script>
