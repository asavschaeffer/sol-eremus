        // Create a temporary bounding box at the potential new position
        enemyCollider
          .copy(enemy.geometry.boundingBox)
          .applyMatrix4(enemy.matrixWorld);
        enemyCollider.translate(moveVector);

        // Check against all obstacles
        for (const obstacle of obstacles) {
          if (!obstacle || !obstacle.parent) continue; // Skip removed or invalid obstacles

          let intersects = false;
          // Special handling for trees (only collide with trunk)
          if (
            obstacle.userData.resourceType === ResourceType.TREE &&
            obstacle.isGroup
          ) {
            for (const child of obstacle.children) {
              if (child.userData?.isTrunk) {
                obstacleCollider.setFromObject(child); // Use trunk's bounding box
                if (enemyCollider.intersectsBox(obstacleCollider)) {
                  intersects = true;
                  break; // Collision found with this tree
                }
              }
            }
          }
          // Handling for other obstacles (rocks, walls, buildings, flags, houses)
          else if (obstacle.userData.isObstacle) {
            obstacleCollider.setFromObject(obstacle); // Use the obstacle's bounding box
            if (enemyCollider.intersectsBox(obstacleCollider)) {
              intersects = true;
            }
          }

          if (intersects) return true; // Collision detected with an obstacle
        }

        // Check against active construction sites
        for (const site of constructionSites) {
          if (!site || !site.parent) continue;
          obstacleCollider.setFromObject(site);
          if (enemyCollider.intersectsBox(obstacleCollider)) {
            return true; // Collision detected with a construction site
          }
        }

        return false; // No collision detected
      }

      /**
       * Moves the player based on input keys and handles collisions.
       * Uses sliding collision response (checks X and Z movement separately).
       * Updates the player's bounding box after movement.
       */
      function movePlayer() {
        const speed = 0.1; // Player movement speed
        const moveDirection = new THREE.Vector3(); // Final movement vector
        const forward = new THREE.Vector3(); // Forward direction relative to camera
        const right = new THREE.Vector3(); // Right direction relative to camera

        // Determine movement direction based on camera view and keys
        if (zoomLevel <= 0) {
          // First-person movement
          camera.getWorldDirection(forward); // Get camera's forward direction
          forward.y = 0; // Ignore vertical component
          forward.normalize();
          right.crossVectors(new THREE.Vector3(0, 1, 0), forward).normalize(); // Calculate right vector (note cross order for right hand rule)
          // Add movement based on keys
          if (keys["w"]) moveDirection.add(forward);
          if (keys["s"]) moveDirection.sub(forward);
          if (keys["a"]) moveDirection.add(right); // A moves left (positive right cross)
          if (keys["d"]) moveDirection.sub(right); // D moves right (negative right cross)
        } else {
          // Third-person movement (relative to camera yaw)
          forward.set(Math.sin(tpYaw), 0, Math.cos(tpYaw)).normalize(); // Forward based on TP camera yaw
          right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize(); // Right based on TP camera yaw
          // Add movement based on keys (directions might feel reversed depending on camera angle)
          if (keys["w"]) moveDirection.sub(forward); // W moves towards camera direction
          if (keys["s"]) moveDirection.add(forward); // S moves away from camera
          if (keys["a"]) moveDirection.add(right); // A moves right relative to camera view
          if (keys["d"]) moveDirection.sub(right); // D moves left relative to camera view
        }

        moveDirection.normalize().multiplyScalar(speed); // Normalize and apply speed

        // --- Sliding Collision Detection ---
        // Check collision for X movement only
        const moveX = new THREE.Vector3(moveDirection.x, 0, 0);
        if (checkPlayerCollision(moveX)) {
          moveDirection.x = 0; // Block X movement if collision
        }

        // Check collision for Z movement ONLY AFTER potential X adjustment
        const moveZ = new THREE.Vector3(0, 0, moveDirection.z);
        // Need a temporary box including the allowed X movement
        const playerColliderZCheck = new THREE.Box3();
        playerColliderZCheck
          .copy(player.geometry.boundingBox)
          .applyMatrix4(player.matrixWorld);
        // Translate only by the Z component we are checking, but *start* from the position potentially modified by X movement check
        playerColliderZCheck.translate(
          new THREE.Vector3(moveDirection.x, 0, 0)
        ); // Apply allowed X move first
        playerColliderZCheck.translate(moveZ); // Then apply potential Z move

        let collisionZ = false;
        // Check Z against obstacles
        for (const obstacle of obstacles) {
          if (!obstacle || !obstacle.parent) continue;
          // Use precise bounding box for collision check
          obstacleCollider.setFromObject(obstacle, true); // Use precise box
          if (playerColliderZCheck.intersectsBox(obstacleCollider)) {
            collisionZ = true;
            break;
          }
        }
        // Check Z against construction sites if no obstacle collision
        if (!collisionZ) {
          for (const site of constructionSites) {
            if (!site || !site.parent) continue;
            obstacleCollider.setFromObject(site);
            if (playerColliderZCheck.intersectsBox(obstacleCollider)) {
              collisionZ = true;
              break;
            }
          }
        }
        if (collisionZ) {
          moveDirection.z = 0; // Block Z movement if collision
        }
        // --- End Sliding Collision Detection ---

        // Apply the final (potentially zeroed) movement vector
        player.position.add(moveDirection);

        // IMPORTANT: Update the player's persistent bounding box AFTER moving
        player.userData.boundingBox.setFromObject(player);
      }

      /**
       * Updates the position of all active player projectiles and despawns them if out of range.
       */
      function updateProjectiles() {
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const proj = projectiles[i];
          // Move projectile
          proj.position.add(
            proj.userData.direction.clone().multiplyScalar(0.3)
          ); // Projectile speed
          // Update distance traveled
          proj.userData.distance = proj.position.distanceTo(
            proj.userData.startPos
          );
          // Check despawn conditions
          const distFromPlayer = proj.position.distanceTo(player.position);
          if (
            distFromPlayer > despawnRadius ||
            proj.userData.distance > maxRange * 2
          ) {
            // Despawn if too far from player or traveled too far
            scene.remove(proj);
            projectiles.splice(i, 1);
          }
        }
      }

      /**
       * Updates the position of all active enemy projectiles and despawns them if out of range.
       */
      function updateEnemyProjectiles() {
        for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
          const proj = enemyProjectiles[i];
          // Move projectile
          proj.position.add(
            proj.userData.direction.clone().multiplyScalar(0.2)
          ); // Enemy projectile speed
          // Update distance traveled
          proj.userData.distance = proj.position.distanceTo(
            proj.userData.startPos
          );
          // Check despawn conditions
          const distFromPlayer = proj.position.distanceTo(player.position);
          const maxEnemyProjRange = 30; // Max range for enemy projectiles
          if (
            distFromPlayer > despawnRadius ||
            proj.userData.distance > maxEnemyProjRange
          ) {
            scene.remove(proj);
            enemyProjectiles.splice(i, 1);
          }
        }
      }

      /**
       * Updates the behavior (movement, targeting, attacking) of all active enemies.
       */
      function updateEnemies() {
        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemy = enemies[i];
          // Despawn check
          const distFromPlayer = enemy.position.distanceTo(player.position);
          if (distFromPlayer > despawnRadius) {
            scene.remove(enemy);
            enemies.splice(i, 1);
            continue;
          }

          // --- Target Selection ---
          let potentialTargets = [];
          // Add player if alive
          if (player.userData.hp > 0)
            potentialTargets.push({
              target: player,
              dist: enemy.position.distanceTo(player.position),
              type: "player",
            });
          // Add donkey if alive
          if (donkey && donkey.userData.hp > 0)
            potentialTargets.push({
              target: donkey,
              dist: enemy.position.distanceTo(donkey.position),
              type: "donkey",
            });
          // Add construction sites if alive
          constructionSites.forEach((site) => {
            if (site.userData.hp > 0)
              potentialTargets.push({
                target: site,
                dist: enemy.position.distanceTo(site.position),
                type: "site",
              });
          });
          // Add completed structures (walls, buildings, flags, houses) if alive
          obstacles.forEach((obs) => {
            if (
              obs.userData.isObstacle &&
              (obs.userData.isWall ||
                obs.userData.isBuilding ||
                obs.userData.isFlag ||
                obs.userData.isHouse) &&
              obs.userData.hp > 0
            ) {
              potentialTargets.push({
                target: obs,
                dist: enemy.position.distanceTo(obs.position),
                type: "structure",
              });
            }
          });

          // Sort targets by distance
          potentialTargets.sort((a, b) => a.dist - b.dist);

          // Select the closest valid target within aggro range
          let target = null;
          let targetDist = Infinity;
          const aggroRadius = 25; // How close a target needs to be for the enemy to notice
          for (const pt of potentialTargets) {
            if (pt.dist <= aggroRadius) {
              target = pt.target;
              targetDist = pt.dist;
              // Prioritize player and donkey
              if (pt.type === "player" || pt.type === "donkey") break;
            }
          }
          // --- End Target Selection ---

          // Update enemy based on type
          if (enemy.userData.enemyType === EnemyType.SHOOTER) {
            enemy.userData.target = target; // Shooters need persistent target info
            updateShooter(enemy, target, targetDist);
          } else if (enemy.userData.enemyType === EnemyType.CHASER) {
            updateChaser(enemy, target, targetDist);
          }

          // Update enemy bounding box if it's a chaser (after potential movement)
          if (
            enemy.userData.enemyType === EnemyType.CHASER &&
            enemy.userData.boundingBox
          ) {
            enemy.userData.boundingBox.setFromObject(enemy);
          }
        }
      }

      /**
       * Updates the behavior of a Chaser enemy, including collision detection.
       * @param {THREE.Mesh} enemy - The chaser enemy mesh.
       * @param {THREE.Object3D | null} target - The current target object.
       * @param {number} targetDist - The distance to the current target.
       */
      function updateChaser(enemy, target, targetDist) {
        const data = enemy.userData;

        // Cooldown and Attack Animation
        if (data.attackCooldown > 0 && !data.isAttacking) {
          data.attackCooldown--;
        }

        if (data.isAttacking) {
          // --- Attack Animation ---
          data.attackProgress++;
          const progressRatio = Math.min(
            1,
            data.attackProgress / data.attackDuration
          );
          enemy.position.lerpVectors(
            data.attackStartPosition,
            data.attackTargetPosition,
            progressRatio
          );

          // --- Attack Hit ---
          if (progressRatio >= 1) {
            const atkTarget = data.attackTarget;
            if (atkTarget && atkTarget.userData?.hp > 0) {
              atkTarget.userData.hp -= data.attackDamage;
              flashMesh(atkTarget, 0xff0000, 150);
              createParticles(
                atkTarget.position,
                5,
                particleMaterials.enemyHit.color,
                0.05,
                30
              );
              if (atkTarget === donkey) {
                protectorScore -= protectorScoreLoss;
                donkey.userData.hasTakenDamage = true;
              } else if (atkTarget === player) {
                protectorScore += protectorScoreGain;
              }
              protectorScore = Math.max(
                protectorScoreMin,
                Math.min(protectorScoreMax, protectorScore)
              );
              console.log(
                `Chaser hit target. HP left: ${atkTarget.userData.hp}`
              );
              if (atkTarget.userData.hp <= 0) {
                console.log("Target destroyed by Chaser!");
                handleTargetDestroyed(atkTarget);
              }
            }
            // --- Reset after Attack ---
            const attackVector = new THREE.Vector3().subVectors(
              data.attackTargetPosition,
              data.attackStartPosition
            );
            attackVector.y = 0;
            attackVector.normalize();
            enemy.position
              .copy(data.attackTargetPosition)
              .addScaledVector(attackVector, -1);
            enemy.position.y = 0.4;
            data.isAttacking = false;
            data.attackProgress = 0;
            data.attackTarget = null;
            data.attackTargetPosition = null;
            data.attackStartPosition = null;
          }
        }
        // --- Movement and Attack Initiation (if not currently attacking) ---
        else if (data.attackCooldown <= 0 && target) {
          const attackRange = 2.0;
          const stopDistance = 0.5;

          if (targetDist < attackRange) {
            // --- Initiate Attack ---
            data.isAttacking = true;
            data.attackProgress = 0;
            data.attackTarget = target;
            const targetPos = target.position.clone();
            targetPos.y = enemy.position.y;
            data.attackTargetPosition = targetPos;
            data.attackStartPosition = enemy.position.clone();
            data.attackCooldown = data.attackCooldownDuration;
          } else if (targetDist > stopDistance) {
            // --- Move Towards Target ---
            const dir = new THREE.Vector3().subVectors(
              target.position,
              enemy.position
            );
            dir.y = 0;
            dir.normalize();
            const speed = tutorialPhase <= 4 ? 0.025 : 0.05;
            const moveDirection = dir.multiplyScalar(speed);

            // --- Enemy Sliding Collision Detection ---
            const moveX = new THREE.Vector3(moveDirection.x, 0, 0);
            if (checkEnemyCollision(enemy, moveX)) {
              moveDirection.x = 0; // Block X movement
            }

            const moveZ = new THREE.Vector3(0, 0, moveDirection.z);
            // Create a temporary collider at the position after potential X move
            const enemyColliderZCheck = new THREE.Box3();
            enemyColliderZCheck
              .copy(enemy.geometry.boundingBox)
              .applyMatrix4(enemy.matrixWorld);
            enemyColliderZCheck.translate(
              new THREE.Vector3(moveDirection.x, 0, 0)
            ); // Apply allowed X move first
            enemyColliderZCheck.translate(moveZ); // Then apply potential Z move

            let collisionZ = false;
            // Check Z against obstacles
            for (const obstacle of obstacles) {
              if (!obstacle || !obstacle.parent) continue;
              obstacleCollider.setFromObject(obstacle, true);
              if (enemyColliderZCheck.intersectsBox(obstacleCollider)) {
                collisionZ = true;
                break;
              }
            }
            // Check Z against construction sites
            if (!collisionZ) {
              for (const site of constructionSites) {
                if (!site || !site.parent) continue;
                obstacleCollider.setFromObject(site);
                if (enemyColliderZCheck.intersectsBox(obstacleCollider)) {
                  collisionZ = true;
                  break;
                }
              }
            }
            if (collisionZ) {
              moveDirection.z = 0; // Block Z movement
            }
            // --- End Enemy Sliding Collision ---

            enemy.position.add(moveDirection); // Apply final movement
          }
        }
      }

      /**
       * Updates the behavior of a Shooter enemy.
       * @param {THREE.Mesh} enemy - The shooter enemy mesh.
       * @param {THREE.Object3D | null} target - The current target object.
       * @param {number} targetDist - The distance to the current target.
       */
      function updateShooter(enemy, target, targetDist) {
        const data = enemy.userData;
        const speed = 0.03; // Shooter movement speed

        // Cooldown
        if (data.shootCooldown > 0) {
          data.shootCooldown--;
        }

        if (target) {
          const dirToTarget = new THREE.Vector3().subVectors(
            target.position,
            enemy.position
          );
          dirToTarget.y = 0;
          dirToTarget.normalize();

          // Movement based on range
          if (targetDist > data.shootRangeMax) {
            // Move closer if too far
            enemy.position.add(dirToTarget.multiplyScalar(speed));
          } else if (targetDist < data.shootRangeMin) {
            // Move away if too close
            enemy.position.add(dirToTarget.multiplyScalar(-speed * 0.8)); // Move back slower
          } else {
            // Within optimal range - shoot if cooldown ready
            if (data.shootCooldown <= 0) {
              fireEnemyProjectile(enemy, target);
              data.shootCooldown = data.shootCooldownDuration; // Reset cooldown
            }
          }
        }
        // If no target, shooter doesn't move (could add wandering later)
      }

      /**
       * Creates and fires an enemy projectile from a shooter towards a target.
       * @param {THREE.Mesh} shooter - The shooting enemy mesh.
       * @param {THREE.Object3D} target - The target object.
       */
      function fireEnemyProjectile(shooter, target) {
        const projSize = 0.15;
        const projGeo = new THREE.SphereGeometry(projSize, 8, 4);
        const proj = new THREE.Mesh(projGeo, enemyProjectileMat);
        // Calculate direction towards target
        const direction = new THREE.Vector3()
          .subVectors(target.position, shooter.position)
          .normalize();
        // Calculate start position slightly in front of the shooter
        const startPos = shooter.position.clone();
        startPos.addScaledVector(direction, 0.7); // Offset start position
        proj.position.copy(startPos);
        proj.userData = {
          direction: direction,
          distance: 0, // Distance traveled
          startPos: startPos.clone(), // Store start position
          damage: shooter.userData.projectileDamage,
          shooter: shooter, // Reference to the shooter (optional)
        };
        scene.add(proj);
        enemyProjectiles.push(proj);
        // Play shoot sound (if available) - Consider a different sound for enemies
        // if (shootSynth) shootSynth.triggerAttackRelease("10n");
      }

      /**
       * Updates the donkey's behavior (fleeing, following, wandering).
       */
      function updateDonkey() {
        if (!donkey || donkey.userData.hp <= 0) return; // Do nothing if no donkey or donkey is dead

        const data = donkey.userData;
        const fleeDistancePanic = 3.0; // Distance to panic and flee quickly
        const fleeDistanceAmbient = 8.0; // Distance to flee slowly if not following
        const fleeSpeed = 0.08; // Speed when panicking
        const followSpeed = 0.05; // Speed when following player
        const followDistance = 4.0; // Distance at which donkey starts following

        let isImmediatelyThreatened = false;
        let closestEnemyDist = Infinity;
        let closestEnemy = null;

        // Find closest enemy and check for immediate threat
        enemies.forEach((enemy) => {
          if (enemy.userData.hp > 0) {
            const dist = donkey.position.distanceTo(enemy.position);
            if (dist < closestEnemyDist) {
              closestEnemyDist = dist;
              closestEnemy = enemy;
            }
            if (dist < fleeDistancePanic) {
              isImmediatelyThreatened = true;
            }
          }
        });

        // --- Behavior Logic ---
        if (isImmediatelyThreatened && closestEnemy) {
          // Panic flee
          const fleeDir = donkey.position.clone().sub(closestEnemy.position); // Direction away from enemy
          fleeDir.y = 0;
          fleeDir.normalize();
          donkey.position.add(fleeDir.multiplyScalar(fleeSpeed));
          data.wanderTimer = 0; // Stop wandering
        } else {
          // Follow player if score is high enough and player is alive
          if (
            protectorScore > protectorScoreThreshold &&
            player.userData.hp > 0
          ) {
            const distToPlayer = donkey.position.distanceTo(player.position);
            if (distToPlayer > followDistance) {
              // Follow if too far
              const dir = new THREE.Vector3().subVectors(
                player.position,
                donkey.position
              );
              dir.y = 0;
              dir.normalize();
              donkey.position.add(dir.multiplyScalar(followSpeed));
              data.wanderTimer = 0; // Stop wandering
            } else {
              // Wander slightly if close to player
              if (data.wanderTimer > 0) {
                data.wanderTimer--;
              } else {
                // Pick new wander direction/duration
                const wanderStrength = 0.015;
                donkey.position.x +=
                  THREE.MathUtils.randFloatSpread(wanderStrength);
                donkey.position.z +=
                  THREE.MathUtils.randFloatSpread(wanderStrength);
                data.wanderTimer = THREE.MathUtils.randInt(
                  data.wanderResetTime * 0.5,
                  data.wanderResetTime * 1.5
                );
              }
            }
          } else {
            // Ambient flee if score is low or player dead
            if (closestEnemy && closestEnemyDist < fleeDistanceAmbient) {
              const fleeDir = donkey.position
                .clone()
                .sub(closestEnemy.position);
              fleeDir.y = 0;
              fleeDir.normalize();
              donkey.position.add(fleeDir.multiplyScalar(fleeSpeed * 0.5)); // Flee slower
            }
            data.wanderTimer = 0; // Stop wandering
          }
        }
        donkey.position.y = 0.4; // Ensure correct height
      }

      /**
       * Checks for collisions between projectiles and targets (enemies, obstacles, player, donkey, structures).
       */
      function checkCollisions() {
        // --- Player Projectile vs Enemy ---
        for (let pi = projectiles.length - 1; pi >= 0; pi--) {
          const proj = projectiles[pi];
          if (!proj?.parent) continue; // Skip if projectile was already removed

          let projectileHitSomething = false;
          for (let ei = enemies.length - 1; ei >= 0; ei--) {
            const enemy = enemies[ei];
            if (!enemy?.parent) continue; // Skip if enemy was already removed

            // Simple distance check for collision
            const collisionDist =
              enemy.userData.enemyType === EnemyType.SHOOTER ? 0.7 : 0.6; // Slightly larger radius for shooters
            if (proj.position.distanceTo(enemy.position) < collisionDist) {
              const hitPoint = proj.position.clone();
              const hitDistance = proj.userData.distance; // Get distance traveled by projectile

              // Apply damage
              enemy.userData.hp -= proj.userData.damage;
              flashMesh(enemy, 0xffffff, 100); // Flash enemy white
              createParticles(
                hitPoint,
                5,
                particleMaterials.enemyHit.color,
                0.05,
                30
              ); // Create hit particles

              // Grant EXP based on hit distance
              if (hitDistance < 7) {
                // Melee range hit
                meleeEXP += 1;
                meleeDamage += 0.1; // Increase melee damage slightly
              } else {
                // Ranged hit
                rangedEXP += 1;
                maxRange += 0.1; // Increase max range slightly
              }

              // Handle enemy death
              if (enemy.userData.hp <= 0) {
                createParticles(
                  enemy.position,
                  15,
                  enemy.material.color,
                  0.08,
                  60
                ); // Death particles
                scene.remove(enemy);
                enemies.splice(ei, 1); // Remove from array
              }

              // Remove projectile
              scene.remove(proj);
              projectiles.splice(pi, 1);
              projectileHitSomething = true;
              if (hitSynth) hitSynth.triggerAttackRelease("C3", "8n"); // Play hit sound
              break; // Projectile can only hit one enemy
            }
          }
          if (projectileHitSomething) continue; // Move to next projectile if this one hit
        }

        // --- Player Projectile vs Obstacle (Trees/Rocks only) ---
        for (let pi = projectiles.length - 1; pi >= 0; pi--) {
          const proj = projectiles[pi];
          if (!proj?.parent) continue;

          let projectileHitSomething = false;
          projCollider.setFromCenterAndSize(proj.position, projSizeVec); // Update projectile collider

          for (let oi = obstacles.length - 1; oi >= 0; oi--) {
            const obstacle = obstacles[oi];
            // Only check against trees and rocks (not walls/buildings/flags)
            if (
              !obstacle?.parent ||
              !obstacle.userData.isObstacle ||
              obstacle.userData.isWall ||
              obstacle.userData.isBuilding ||
              obstacle.userData.isFlag ||
              obstacle.userData.isHouse
            )
              continue;

            let hitDetected = false;
            let hitPoint = proj.position.clone();
            let collisionTarget = null;

            // Collision check based on obstacle type
            if (obstacle.userData.resourceType === ResourceType.ROCK) {
              const collisionRadius = 0.8; // Simple distance check for rocks
              if (
                proj.position.distanceTo(obstacle.position) < collisionRadius
              ) {
                hitDetected = true;
                collisionTarget = obstacle;
              }
            } else if (
              obstacle.userData.resourceType === ResourceType.TREE &&
              obstacle.isGroup
            ) {
              // Check against tree trunk bounding box
              for (const child of obstacle.children) {
                if (child.userData?.isTrunk) {
                  obstacleCollider.setFromObject(child);
                  if (projCollider.intersectsBox(obstacleCollider)) {
                    hitDetected = true;
                    collisionTarget = obstacle; // Target the whole tree group
                    break;
                  }
                }
              }
            }

            // Handle hit
            if (hitDetected && collisionTarget) {
              collisionTarget.userData.hp -= proj.userData.damage; // Apply damage
              flashMesh(collisionTarget, 0xffffff, 100); // Flash obstacle white
              // Determine particle color based on resource type
              let particleColor =
                collisionTarget.userData.resourceType === ResourceType.TREE
                  ? particleMaterials.woodHit.color
                  : particleMaterials.stoneHit.color;
              createParticles(hitPoint, 3, particleColor, 0.03, 20); // Create hit particles

              // Handle obstacle destruction
              if (collisionTarget.userData.hp <= 0) {
                // Grant resources
                if (collisionTarget.userData.resourceType === ResourceType.TREE)
                  wood++;
                else if (
                  collisionTarget.userData.resourceType === ResourceType.ROCK
                )
                  stone++;
                updateUI(); // Update resource display
                createParticles(
                  collisionTarget.position,
                  10,
                  particleColor,
                  0.05,
                  40
                ); // Destruction particles
                scene.remove(collisionTarget); // Remove from scene
                obstacles.splice(oi, 1); // Remove from array
              }

              // Remove projectile
              scene.remove(proj);
              projectiles.splice(pi, 1);
              projectileHitSomething = true;
              if (hitSynth) hitSynth.triggerAttackRelease("A2", "8n"); // Play different hit sound for obstacles
              break; // Projectile hits only one obstacle
            }
          }
          if (projectileHitSomething) continue;
        }

        // --- Enemy Projectile vs Targets (Player, Donkey, Sites, Structures) ---
        for (let epi = enemyProjectiles.length - 1; epi >= 0; epi--) {
          const proj = enemyProjectiles[epi];
          if (!proj?.parent) continue;

          let projectileRemoved = false;
          let hitTarget = null;

          // Check Player collision
          if (
            !projectileRemoved &&
            player.userData.hp > 0 &&
            proj.position.distanceTo(player.position) < 0.6
          ) {
            hitTarget = player;
            projectileRemoved = true;
            console.log("Player Hit by enemy projectile!");
          }
          // Check Donkey collision
          if (
            !projectileRemoved &&
            donkey &&
            donkey.userData.hp > 0 &&
            proj.position.distanceTo(donkey.position) < 0.6
          ) {
            hitTarget = donkey;
            projectileRemoved = true;
            console.log("Donkey Hit by enemy projectile!");
          }
          // Check Construction Site collision
          if (!projectileRemoved) {
            for (let csi = constructionSites.length - 1; csi >= 0; csi--) {
              const site = constructionSites[csi];
              if (
                site.userData.hp > 0 &&
                proj.position.distanceTo(site.position) < 0.6
              ) {
                // Use site's bounding box? Distance check might be ok
                hitTarget = site;
                projectileRemoved = true;
                console.log("Site Hit by enemy projectile!");
                break;
              }
            }
          }
          // Check Completed Structure collision (Walls, Buildings, Flags, Houses)
          if (!projectileRemoved) {
            for (let oi = obstacles.length - 1; oi >= 0; oi--) {
              const obstacle = obstacles[oi];
              // Check only against structures with HP
              if (
                obstacle.userData.isObstacle &&
                (obstacle.userData.isWall ||
                  obstacle.userData.isBuilding ||
                  obstacle.userData.isFlag ||
                  obstacle.userData.isHouse) &&
                obstacle.userData.hp > 0
              ) {
                // Use bounding box intersection for more accuracy with walls/buildings?
                const structureCollider = new THREE.Box3().setFromObject(
                  obstacle
                );
                const projPointCollider = new THREE.Box3().setFromCenterAndSize(
                  proj.position,
                  new THREE.Vector3(0.1, 0.1, 0.1)
                ); // Small box for projectile point
                if (structureCollider.intersectsBox(projPointCollider)) {
                  hitTarget = obstacle;
                  projectileRemoved = true;
                  console.log("Structure Hit by enemy projectile!");
                  break;
                }
              }
            }
          }

          // Handle hit if target found
          if (hitTarget) {
            hitTarget.userData.hp -= proj.userData.damage; // Apply damage
            flashMesh(hitTarget, 0xff0000, 150); // Flash target red
            createParticles(
              proj.position,
              5,
              particleMaterials.enemyHit.color,
              0.05,
              30
            ); // Hit particles
            console.log(`Target HP: ${hitTarget.userData.hp}`);

            // Handle target destruction
            if (hitTarget.userData.hp <= 0) {
              console.log("Target destroyed by enemy projectile!");
              handleTargetDestroyed(hitTarget); // Centralized destruction logic
            }

            // Update protector score if player or donkey hit
            if (hitTarget === player) {
              protectorScore += protectorScoreGain;
            } else if (hitTarget === donkey) {
              protectorScore -= protectorScoreLoss;
              donkey.userData.hasTakenDamage = true; // Mark donkey as hit
            }
            // Clamp score if player or donkey was the target
            if (hitTarget === player || hitTarget === donkey) {
              protectorScore = Math.max(
                protectorScoreMin,
                Math.min(protectorScoreMax, protectorScore)
              );
            }

            // Remove projectile
            scene.remove(proj);
            enemyProjectiles.splice(epi, 1);
            if (enemyHitSynth) enemyHitSynth.triggerAttackRelease("8n"); // Play enemy hit sound
          }
        }
      }

      /**
       * Handles the removal and cleanup of a destroyed target object.
       * @param {THREE.Object3D} target - The object that was destroyed.
       */
      function handleTargetDestroyed(target) {
        if (!target) return;
        const uuid = target.uuid;

        if (target === player) {
          console.error("PLAYER DESTROYED - GAME OVER (Not fully implemented)");
          // Add game over logic here (e.g., stop game loop, show message)
          // For now, just log it. Player mesh remains but HP is 0.
        } else if (target === donkey) {
          donkey.material.color.set(0x666666); // Make donkey grey
          // Donkey object remains but HP is 0.
        } else if (target.userData.isConstructionSite) {
          const index = constructionSites.findIndex((s) => s.uuid === uuid);
          if (index > -1) constructionSites.splice(index, 1);
          removeRangeIndicator(uuid); // Remove associated indicator
          scene.remove(target); // Remove from scene
        } else if (target.userData.isObstacle) {
          // This covers Walls, Buildings, Flags, Houses, Trees, Rocks
          const index = obstacles.findIndex((o) => o.uuid === uuid);
          if (index > -1) obstacles.splice(index, 1);
          // Remove indicator if it's a structure that had one
          if (target.userData.indicatorUUID) {
            removeRangeIndicator(target.userData.indicatorUUID);
          }
          scene.remove(target); // Remove from scene
        } else {
          // Fallback for any other object type (shouldn't normally happen)
          scene.remove(target);
        }
        // Note: Projectiles are handled in their collision checks. Enemies are handled in theirs.
      }

      /**
       * Creates and fires a player projectile based on camera view and click/aim point.
       * @param {MouseEvent | null} event - The mouse event (for TP aiming) or null (for FP aiming).
       * @param {THREE.Vector3 | null} targetPoint - (Not currently used) A specific target point.
       */
      function handleShoot(event, targetPoint = null) {
        if (player.userData.hp <= 0) return;

        let direction;
        const projectileStartOffset = 0.6; // How far in front of player projectile starts
        const playerHeadPos = player.position
          .clone()
          .add(new THREE.Vector3(0, 0.5, 0)); // Approx head height

        // Determine direction based on camera mode
        if (zoomLevel <= 0) {
          // First-person: shoot straight from camera
          direction = new THREE.Vector3(0, 0, -1).applyQuaternion(
            camera.quaternion
          );
        } else {
          // Third-person: shoot towards mouse click on ground plane
          if (!event) {
            // Fallback if no event (e.g., called programmatically) - shoot forward based on TP yaw
            const forwardBasedOnYaw = new THREE.Vector3(
              Math.sin(tpYaw),
              0,
              Math.cos(tpYaw)
            );
            direction = forwardBasedOnYaw.negate().normalize(); // Negate because forward vector points away from target
          } else {
            // Raycast from camera through mouse position to find ground intersection
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);

            if (intersects.length > 0) {
              // Hit the ground
              const groundHitPoint = intersects[0].point;
              // Direction from player head to ground hit point
              direction = new THREE.Vector3()
                .subVectors(groundHitPoint, playerHeadPos)
                .normalize();
            } else {
              // Didn't hit ground (clicked sky?) - aim towards ray direction far away
              const target = new THREE.Vector3();
              raycaster.ray.at(100, target); // Get point far along the ray
              direction = new THREE.Vector3()
                .subVectors(target, playerHeadPos)
                .normalize();
            }
          }
        }

        // Create projectile mesh
        const projGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const projMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const proj = new THREE.Mesh(projGeo, projMat);

        // Calculate start position
        const startPos = playerHeadPos.clone();
        startPos.addScaledVector(direction, projectileStartOffset); // Offset start position
        proj.position.copy(startPos);

        // Set projectile data
        proj.userData = {
          direction: direction,
          distance: 0,
          startPos: startPos.clone(),
          damage: meleeDamage, // Use meleeDamage stat for projectiles for now
        };

        // Add to scene and array
        scene.add(proj);
        projectiles.push(proj);
        if (shootSynth) shootSynth.triggerAttackRelease("20n"); // Play shoot sound
      }

      /**
       * Creates multiple particle meshes at a position.
       * @param {THREE.Vector3} position - Center position for particle burst.
       * @param {number} count - Number of particles to create.
       * @param {THREE.Color | number} color - Color of the particles.
       * @param {number} speed - Base speed/spread of particles.
       * @param {number} lifetime - Base lifetime (in frames) of particles.
       */
      function createParticles(position, count, color, speed, lifetime) {
        for (let i = 0; i < count; i++) {
          const mat = new THREE.MeshBasicMaterial({ color: color }); // Use basic material for performance
          const particle = new THREE.Mesh(particleGeo, mat);
          // Randomize start position slightly around the center
          particle.position.copy(position);
          particle.position.x += THREE.MathUtils.randFloatSpread(0.2);
          particle.position.y += THREE.MathUtils.randFloatSpread(0.2);
          particle.position.z += THREE.MathUtils.randFloatSpread(0.2);
          // Randomize velocity
          const velocity = new THREE.Vector3(
            THREE.MathUtils.randFloatSpread(speed),
            THREE.MathUtils.randFloatSpread(speed),
            THREE.MathUtils.randFloatSpread(speed)
          );
          // Store particle data
          particle.userData = {
            velocity: velocity,
            lifetime: lifetime + Math.random() * lifetime * 0.5, // Randomize lifetime slightly
          };
          particles.push(particle);
          scene.add(particle);
        }
      }

      /**
       * Updates the position and lifetime of all active particles.
       */
      function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.position.add(p.userData.velocity); // Move particle
          p.userData.lifetime--; // Decrease lifetime
          // Remove particle if lifetime expired
          if (p.userData.lifetime <= 0) {
            scene.remove(p);
            particles.splice(i, 1);
          }
        }
      }

      /**
       * Temporarily changes the color of a mesh or meshes within a group to indicate a hit/event.
       * @param {THREE.Mesh | THREE.Group} targetMesh - The mesh or group to flash.
       * @param {number} [flashColorHex=0xffffff] - The color to flash (hex).
       * @param {number} [durationMs=150] - Duration of the flash in milliseconds.
       */
      function flashMesh(
        targetMesh,
        flashColorHex = 0xffffff,
        durationMs = 150
      ) {
        if (!targetMesh) return;

        const meshesToFlash = [];
        // Find all mesh children if it's a group
        if (targetMesh.isMesh) {
          meshesToFlash.push(targetMesh);
        } else if (targetMesh.isGroup) {
          targetMesh.traverse((child) => {
            if (child.isMesh && child.material?.color) {
              meshesToFlash.push(child);
            }
          });
        }

        meshesToFlash.forEach((mesh) => {
          // Ensure mesh has color and isn't already flashing
          if (!mesh.material?.color || mesh.userData?.isFlashing) {
            return;
          }

          mesh.userData = mesh.userData || {};
          const originalColorHex = mesh.material.color.getHex(); // Store original color
          mesh.userData.isFlashing = true; // Set flashing flag
          mesh.material.color.setHex(flashColorHex); // Set flash color

          // Set timeout to revert color
          setTimeout(() => {
            // Check if mesh still exists and has material before reverting
            if (mesh.parent && mesh.material) {
              mesh.material.color.setHex(originalColorHex);
            }
            if (mesh.userData) {
              mesh.userData.isFlashing = false; // Clear flashing flag
            }
          }, durationMs);
        });
      }
