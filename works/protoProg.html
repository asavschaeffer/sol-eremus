<!DOCTYPE html>
<html>
  <head>
    <title>Survivor.io 3D - Enemy Collision</title>
    <style>
      /* Basic body styling */
      body {
        margin: 0;
        overflow: hidden; /* Prevent scrollbars */
        font-family: "Inter", sans-serif; /* Use Inter font */
        height: 100%; /* Ensure body takes full height */
      }
      /* Ensure canvas takes full screen */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* UI overlay styling */
      #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        padding: 8px 12px;
        background-color: rgba(0, 0, 0, 0.6); /* Semi-transparent black */
        color: white;
        font-size: 14px;
        border-radius: 8px; /* Rounded corners */
        line-height: 1.5;
      }
      /* Tutorial box styling */
      #tutorial {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%); /* Center horizontally */
        padding: 15px 25px;
        background-color: rgba(
          0,
          0,
          0,
          0.7
        ); /* Darker semi-transparent black */
        color: white;
        font-size: 18px;
        text-align: center;
        border-radius: 10px; /* Rounded corners */
        max-width: 80%; /* Limit width */
      }
      /* Style for completed tutorial steps */
      .completed {
        color: #888888; /* Grey color */
        text-decoration: line-through; /* Strikethrough */
      }
      /* Basic button styling */
      button {
        padding: 10px 15px;
        margin: 5px;
        border: none;
        border-radius: 5px; /* Rounded corners */
        background-color: #4caf50; /* Green background */
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s; /* Smooth hover effect */
      }
      /* Button hover effect */
      button:hover {
        background-color: #45a049; /* Darker green on hover */
      }
      /* Ensure html takes full height */
      html {
        height: 100%;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <a
      target="_blank"
      href="https://jam.pieter.com"
      style="
        font-family: 'system-ui', sans-serif;
        position: fixed;
        bottom: -1px;
        right: -1px;
        padding: 7px;
        font-size: 14px;
        font-weight: bold;
        background: #fff;
        color: #000;
        text-decoration: none;
        z-index: 10;
        border-top-left-radius: 12px;
        z-index: 10000;
        border: 1px solid #fff;
      "
      >🕹️ Vibe Jam 2025</a
    >
    <div id="ui">
      <div>Melee EXP: 0 | Ranged EXP: 0</div>
      <div>Damage: 1.0 | Range: 6.0</div>
      <div>Player HP: 10 | Donkey HP: 10</div>
      <div>Wood: 10 | Stone: 10</div>
      <div>Protector Score: 0</div>
    </div>
    <div id="tutorial">
      Use <span id="w">W</span><span id="a">A</span><span id="s">S</span
      ><span id="d">D</span> to move around and
      <span id="drag">right-click + drag</span> to turn the camera. (<span
        id="phase1Counter"
        >0</span
      >/5)
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

    <script>
      // ========================================================
      // ========== SCENE SETUP & CORE VARIABLES ===============
      // ========================================================

      // Initialize Three.js scene
      const scene = new THREE.Scene();
      const backgroundColor = 0x87ceeb; // Sky blue background
      scene.background = new THREE.Color(backgroundColor);
      scene.fog = new THREE.FogExp2(backgroundColor, 0.01); // Add fog for depth

      // Initialize camera
      const camera = new THREE.PerspectiveCamera(
        75, // Field of view
        window.innerWidth / window.innerHeight, // Aspect ratio
        0.1, // Near clipping plane
        1000 // Far clipping plane
      );

      // Initialize renderer
      const renderer = new THREE.WebGLRenderer({ antialias: true }); // Enable anti-aliasing
      renderer.setSize(window.innerWidth, window.innerHeight); // Set size to window dimensions
      renderer.setPixelRatio(window.devicePixelRatio); // Adjust for high DPI screens
      renderer.shadowMap.enabled = true; // Enable shadows
      renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Softer shadows
      document.body.appendChild(renderer.domElement); // Add renderer to the DOM

      // Clock for timing (delta time)
      const clock = new THREE.Clock();

      // ========================================================
      // ========== GAME OBJECTS & ENTITIES =====================
      // ========================================================

      // --- Player ---
      const playerSize = 1.0;
      const playerGeo = new THREE.BoxGeometry(
        playerSize,
        playerSize,
        playerSize
      );
      const playerMat = new THREE.MeshStandardMaterial({
        color: 0x4a90e2, // Blue color
        roughness: 0.6,
      });
      const player = new THREE.Mesh(playerGeo, playerMat);
      player.position.set(0, playerSize / 2, 0); // Start at center, slightly above ground
      player.userData = { hp: 10, maxHp: 10 }; // Player health data
      player.castShadow = true; // Player casts shadows
      player.geometry.computeBoundingBox(); // Pre-calculate bounding box
      player.userData.boundingBox = new THREE.Box3(); // Initialize player bounding box for collision
      player.userData.boundingBox.setFromObject(player); // Set initial state of bounding box
      scene.add(player); // Add player to the scene

      // --- Ground ---
      const groundSize = 500; // Large ground plane
      const groundGeo = new THREE.PlaneGeometry(groundSize, groundSize);
      const groundMat = new THREE.MeshStandardMaterial({
        color: 0x55aa55, // Green color
        roughness: 0.9,
        side: THREE.DoubleSide, // Render both sides
      });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2; // Rotate to be horizontal
      ground.position.y = 0; // Position at Y=0
      ground.receiveShadow = true; // Ground receives shadows
      scene.add(ground); // Add ground to the scene

      // --- Entity Arrays ---
      let donkey = null;
      const projectiles = [];
      const enemyProjectiles = [];
      const enemies = [];
      const obstacles = [];
      const particles = [];
      const constructionSites = [];
      const rangeIndicators = {};

      // --- Portal Variables ---
      let startPortalBox, exitPortalBox;
      const SPAWN_POINT_X = 0; // Player spawn point (center of map)
      const SPAWN_POINT_Y = 0.5; // Slightly above ground (player height/2)
      const SPAWN_POINT_Z = 0;
      const EXIT_PORTAL_X = -25; // Far enough to be an exploration goal
      const EXIT_PORTAL_Y = 10; // High up to match your game's verticality
      const EXIT_PORTAL_Z = -25;
      let selfUsername = "Player1"; // Default username, could be dynamic
      let currentSpeed = 0.1; // Matches your player speed

      // --- Enums for Types ---
      const EnemyType = { CHASER: "chaser", SHOOTER: "shooter" };
      const ResourceType = { TREE: "tree", ROCK: "rock" };
      const StructureType = {
        FLAG: "flag",
        WALL: "wall", // Connecting walls
        BUILDING: "building", // Central foundation/building
        HOUSE: "house", // Completed house structure
      };

      // --- Materials Cache (for performance) ---
      const enemyChaserMat = new THREE.MeshStandardMaterial({
        color: 0xff4136,
        roughness: 0.6,
      }); // Red
      const enemyShooterMat = new THREE.MeshStandardMaterial({
        color: 0x8e44ad,
        roughness: 0.6,
      }); // Purple
      const enemyProjectileMat = new THREE.MeshBasicMaterial({
        color: 0xffa500,
      }); // Orange
      const treeTrunkMat = new THREE.MeshStandardMaterial({
        color: 0x8b4513,
        roughness: 0.8,
      }); // Brown
      const treeLeavesMat = new THREE.MeshStandardMaterial({
        color: 0x228b22,
        roughness: 0.8,
      }); // Green
      const rockMat = new THREE.MeshStandardMaterial({
        color: 0x808080,
        roughness: 0.7,
      }); // Grey
      const constructionSiteMat = new THREE.MeshStandardMaterial({
        color: 0xffd700,
        roughness: 0.5,
        transparent: true,
        opacity: 0.7,
      }); // Gold, transparent
      const wallMat = new THREE.MeshStandardMaterial({
        color: 0xaaaaaa,
        roughness: 0.8,
      }); // Light grey for final walls
      const flagPoleMat = new THREE.MeshStandardMaterial({
        color: 0x8b4513,
        roughness: 0.7,
      }); // Brown
      const flagTopMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.9,
      }); // White
      const buildingMat = new THREE.MeshStandardMaterial({
        color: 0x777777,
        roughness: 0.8,
      }); // Dark grey for final buildings
      const roofMat = new THREE.MeshStandardMaterial({
        color: 0xcc6633,
        roughness: 0.8,
      }); // Brownish roof color

      // Particle materials
      const particleMaterials = {
        enemyHit: new THREE.MeshBasicMaterial({ color: 0xffffff }), // White for enemy hit
        woodHit: new THREE.MeshBasicMaterial({ color: 0x8b4513 }), // Brown for wood hit
        stoneHit: new THREE.MeshBasicMaterial({ color: 0xaaaaaa }), // Grey for stone hit
      };

      // --- Geometries Cache ---
      const particleGeo = new THREE.BoxGeometry(0.05, 0.05, 0.05); // Small cube for particles
      const baseStructureGeo = new THREE.BoxGeometry(1, 2, 1); // Geometry for central buildings/sites
      const flagPoleGeo = new THREE.CylinderGeometry(0.05, 0.05, 2, 8); // Geometry for flag pole
      const flagTopGeo = new THREE.BoxGeometry(0.4, 0.3, 0.05); // Geometry for flag top
      const wallThickness = 0.1; // Thickness for connecting walls
      const wallHeight = 1.5; // Height for connecting walls
      // Wall geometry will be created dynamically based on length
      const enemyChaserGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8); // Chaser enemy geometry
      enemyChaserGeo.computeBoundingBox(); // Pre-calculate bounding box for enemies

      // --- Projectile Collision Helper ---
      const projCollider = new THREE.Box3(); // Reusable Box3 for projectile collision
      const projSizeVec = new THREE.Vector3(0.2, 0.2, 0.2); // Size vector for projectile collider

      // --- Ghost Mesh & Materials (for build preview) ---
      const ghostOpacity = 0.4;
      const ghostBuildingMat = new THREE.MeshBasicMaterial({
        color: 0x777777,
        transparent: true,
        opacity: ghostOpacity,
        wireframe: true,
      });
      const ghostFlagMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: ghostOpacity,
        wireframe: true,
      });
      let ghostMesh = new THREE.Mesh(baseStructureGeo, ghostBuildingMat); // Initial ghost mesh
      ghostMesh.visible = false; // Initially hidden
      ghostMesh.position.y = baseStructureGeo.parameters.height / 2; // Position correctly
      scene.add(ghostMesh); // Add ghost mesh to scene

      // --- Wall Preview ---
      const wallPreviewMat = new THREE.MeshBasicMaterial({
        color: 0xaaaaaa,
        transparent: true,
        opacity: ghostOpacity,
        wireframe: true,
      });
      const previewWalls = []; // Array to hold wall preview meshes
      const MAX_PREVIEW_WALLS = 10; // Limit number of preview walls for performance

      // --- Range Indicator Assets ---
      const buildProximityRadius = 5.0; // Radius within which player builds/completes sites
      const indicatorShowRadius = buildProximityRadius + 5.0; // Radius at which indicators become visible
      const rangeIndicatorGeo = new THREE.RingGeometry(
        buildProximityRadius - 0.1,
        buildProximityRadius,
        32
      ); // Geometry for the ring
      // Different materials for indicator states
      const rangeIndicatorMat = new THREE.MeshBasicMaterial({
        color: 0xffff00,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.3,
      }); // Yellow (visible)
      const rangeIndicatorActiveMat = new THREE.MeshBasicMaterial({
        color: 0x00ff00,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.5,
      }); // Green (active build)
      const rangeIndicatorCompletedMat = new THREE.MeshBasicMaterial({
        color: 0xcccccc,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.2,
      }); // Grey (completed)

      // ========================================================
      // ========== SOUND SETUP (Tone.js) =======================
      // ========================================================

      // Sound Synths (initialized later after user interaction)
      let buildCompleteSynth, shootSynth, hitSynth, enemyHitSynth;
      let toneStarted = false; // Flag to track if Tone.js context is started

      /**
       * Initializes Tone.js audio context and synths.
       * Must be called after a user interaction (click or keydown).
       */
      function startTone() {
        if (!toneStarted && Tone.context.state !== "running") {
          Tone.start()
            .then(() => {
              // Create synths after context is running
              buildCompleteSynth = new Tone.Synth().toDestination();
              shootSynth = new Tone.NoiseSynth({
                noise: { type: "white" },
                envelope: { attack: 0.001, decay: 0.1, sustain: 0 },
              }).toDestination();
              hitSynth = new Tone.MembraneSynth().toDestination();
              enemyHitSynth = new Tone.MetalSynth({
                frequency: 50,
                envelope: { attack: 0.001, decay: 0.1, release: 0.01 },
                harmonicity: 3.1,
                modulationIndex: 16,
                resonance: 400,
                octaves: 0.5,
              }).toDestination();
              console.log("Tone.js Context Started");
              toneStarted = true;
            })
            .catch((e) => console.error("Tone.start failed:", e));
        } else if (toneStarted && !buildCompleteSynth) {
          // Fallback if context started but synths weren't created (e.g., rapid interactions)
          buildCompleteSynth = new Tone.Synth().toDestination();
          shootSynth = new Tone.NoiseSynth({
            /* ... */
          }).toDestination();
          hitSynth = new Tone.MembraneSynth().toDestination();
          enemyHitSynth = new Tone.MetalSynth({
            /* ... */
          }).toDestination();
        }
      }
      // Add listeners to start Tone.js on first interaction
      window.addEventListener("click", startTone, { once: true });
      window.addEventListener("keydown", startTone, { once: true });

      // ========================================================
      // ========== LIGHTING ====================================
      // ========================================================

      // Ambient light for overall illumination
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      // Directional light for shadows and highlights
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(25, 30, 20); // Position the light source
      directionalLight.castShadow = true; // Enable shadow casting
      // Configure shadow properties
      directionalLight.shadow.mapSize.width = 1024;
      directionalLight.shadow.mapSize.height = 1024;
      directionalLight.shadow.camera.near = 0.5;
      directionalLight.shadow.camera.far = 100;
      directionalLight.shadow.camera.left = -40;
      directionalLight.shadow.camera.right = 40;
      directionalLight.shadow.camera.top = 40;
      directionalLight.shadow.camera.bottom = -40;
      scene.add(directionalLight);

      // ========================================================
      // ========== GAME STATE & PARAMETERS =====================
      // ========================================================

      // Player stats
      let meleeEXP = 0,
        rangedEXP = 0,
        meleeDamage = 1,
        maxRange = 6;

      // Tutorial state
      let tutorialPhase = 1,
        enemySpawned = false,
        phaseTimer = 0;
      let phase1InputsCompleted = 0; // Counter for WASD/Drag inputs in phase 1
      const phase1CounterUI = document.getElementById("phase1Counter"); // UI element for the counter

      // Enemy spawning parameters
      let spawnTimer = 0;
      let spawnInterval = 300; // Initial interval (in frames)
      const minSpawnInterval = 45; // Minimum spawn interval
      const spawnIntervalDecrement = 2; // How much to decrease interval each spawn
      const playerSpawnRadius = 65; // Radius around player where enemies spawn
      const despawnRadius = 90; // Radius beyond which entities despawn

      // Resources
      let wood = 10,
        stone = 10;
      const siteCost = { wood: 1, stone: 1 }; // Cost to place a construction site

      // Donkey protection score
      let protectorScore = 0;
      const protectorScoreThreshold = 3; // Score needed for donkey to follow player
      const protectorScoreMax = 10; // Max score
      const protectorScoreMin = -10; // Min score
      const protectorScoreGain = 1; // Score gain when player is hit
      const protectorScoreLoss = 1.5; // Score loss when donkey is hit

      // Building state
      const neighborCheckRadius = 1.5; // Small radius to check for adjacent completed structures
      let isPreviewingBuild = false; // Flag if player is holding 'E' to preview

      // UI Elements
      const ui = document.getElementById("ui");
      const tutorialUI = document.getElementById("tutorial");

      // ========================================================
      // ========== CAMERA & CONTROLS ===========================
      // ========================================================

      // Camera state
      let zoomLevel = 1; // 0 = First Person, 1 = Third Person (max zoom out)
      let isPointerLocked = false; // If mouse is locked for FP view
      let isRotating = false; // If right mouse button is held for TP rotation
      let dragDistance = 0; // Track mouse drag distance for tutorial phase 1

      // First-person camera angles
      let fpPitch = 0,
        fpYaw = 0;
      // Third-person camera parameters
      let tpDistance = 10,
        tpHeight = 5,
        tpYaw = 0,
        tpPitch = -Math.PI / 4;

      // Input state
      const keys = {}; // Tracks currently pressed keys
      const inputsUsed = {
        w: false,
        a: false,
        s: false,
        d: false,
        drag: false,
      }; // Tracks tutorial inputs used

      // --- Event Listeners ---

      // Handle clicks on the canvas
      renderer.domElement.addEventListener("click", (e) => {
        startTone(); // Ensure audio context is started
        // Enter pointer lock in FP view on left click
        if (zoomLevel <= 0 && !isPointerLocked && e.button === 0) {
          renderer.domElement
            .requestPointerLock()
            .catch((err) => console.error("Pointer lock failed:", err));
        } else if (e.button === 0) {
          // Handle shooting on left click
          handlePrimaryClick(e);
        }
      });

      // Handle pointer lock changes
      document.addEventListener("pointerlockchange", () => {
        isPointerLocked = document.pointerLockElement === renderer.domElement;
      });

      // Handle mouse movement for camera control
      document.addEventListener("mousemove", (e) => {
        // First-person camera rotation (pointer locked)
        if (isPointerLocked && zoomLevel <= 0) {
          fpYaw -= e.movementX * 0.002;
          fpPitch -= e.movementY * 0.002;
          fpPitch = THREE.MathUtils.clamp(
            fpPitch,
            -Math.PI / 2 + 0.01,
            Math.PI / 2 - 0.01
          ); // Clamp pitch
        }
        // Third-person camera rotation (right-click held)
        else if (isRotating && zoomLevel > 0) {
          tpYaw -= e.movementX * 0.003;
          tpPitch -= e.movementY * 0.003;
          tpPitch = THREE.MathUtils.clamp(
            tpPitch,
            -Math.PI / 2 + 0.1,
            Math.PI / 2 - 0.1
          ); // Clamp pitch

          // Track drag distance for tutorial phase 1
          dragDistance += Math.abs(e.movementX) + Math.abs(e.movementY);
          if (tutorialPhase === 1 && dragDistance > 200 && !inputsUsed.drag) {
            inputsUsed.drag = true;
            phase1InputsCompleted++;
            console.log(`Phase 1 Input: drag, Count: ${phase1InputsCompleted}`);
            document.getElementById("drag")?.classList.add("completed");
            if (phase1CounterUI)
              phase1CounterUI.textContent = phase1InputsCompleted;
          }
        }
      });

      // Handle mouse button presses
      window.addEventListener("mousedown", (e) => {
        startTone();
        // Start TP camera rotation on right-click
        if (e.button === 2 && zoomLevel > 0) {
          isRotating = true;
          dragDistance = 0; // Reset drag distance for tutorial check
        }
      });

      // Handle mouse button releases
      window.addEventListener("mouseup", (e) => {
        // Stop TP camera rotation on right-click release
        if (e.button === 2) {
          isRotating = false;
        }
      });

      // Prevent context menu on right-click
      window.addEventListener("contextmenu", (e) => e.preventDefault());

      // Handle mouse wheel for zooming
      window.addEventListener("wheel", (e) => {
        zoomLevel += e.deltaY * 0.001; // Adjust zoom level based on scroll
        zoomLevel = THREE.MathUtils.clamp(zoomLevel, 0, 1); // Clamp zoom level
        // Exit pointer lock if zooming out from FP
        if (zoomLevel > 0 && isPointerLocked) {
          document.exitPointerLock();
        }
      });

      // Handle key presses
      window.addEventListener("keydown", (e) => {
        startTone();
        const key = e.key.toLowerCase();
        if (keys[key]) return; // Prevent multiple triggers for held keys
        keys[key] = true;

        // Track WASD input for tutorial phase 1
        if (
          tutorialPhase === 1 &&
          ["w", "a", "s", "d"].includes(key) &&
          !inputsUsed[key]
        ) {
          inputsUsed[key] = true;
          phase1InputsCompleted++;
          console.log(`Phase 1 Input: ${key}, Count: ${phase1InputsCompleted}`);
          document.getElementById(key)?.classList.add("completed");
          if (phase1CounterUI)
            phase1CounterUI.textContent = phase1InputsCompleted;
        }

        // Toggle camera view with 'C' key
        if (key === "c") {
          zoomLevel = zoomLevel === 0 ? 1 : 0;
          if (zoomLevel > 0 && isPointerLocked) {
            document.exitPointerLock(); // Exit pointer lock if switching to TP
          }
        }

        // Start build preview with 'E' key (if tutorial allows)
        if (key === "e" && tutorialPhase >= 3.5 && !isPreviewingBuild) {
          isPreviewingBuild = true;
          ghostMesh.visible = true; // Show the ghost mesh
          console.log("[DEBUG] 'E' keydown. isPreviewingBuild = true.");
        }
      });

      // Handle key releases
      window.addEventListener("keyup", (e) => {
        const key = e.key.toLowerCase();
        keys[key] = false;

        // Handle build placement on 'E' key release
        if (key === "e" && isPreviewingBuild) {
          isPreviewingBuild = false;
          console.log("[DEBUG] 'E' keyup. isPreviewingBuild = false.");
          if (ghostMesh.visible) {
            console.log(
              "[DEBUG] Ghost visible, calling handlePlaceConstruction..."
            );
            // Place the construction site at the ghost mesh's position
            handlePlaceConstruction(ghostMesh.position.clone());
          } else {
            console.log(
              "[DEBUG] Ghost mesh not visible, placement cancelled on keyup."
            );
          }
          // Hide ghost and previews
          ghostMesh.visible = false;
          updateWallPreviews(null, []);
          updatePreviewIndicators(null);
        }
      });

      // Raycaster for mouse picking (used in TP shooting)
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2(); // Stores normalized mouse coordinates

      // Handle window resizing
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight; // Update aspect ratio
        camera.updateProjectionMatrix(); // Apply changes
        renderer.setSize(window.innerWidth, window.innerHeight); // Resize renderer
        renderer.setPixelRatio(window.devicePixelRatio); // Update pixel ratio
      });

      // ========================================================
      // ========== CORE FUNCTIONS ==============================
      // ========================================================

      // --- Spawning Functions ---

      /**
       * Spawns the donkey near the player.
       */
      function spawnDonkey() {
        if (donkey) return; // Only spawn one donkey
        const dG = new THREE.BoxGeometry(0.8, 0.8, 1.5);
        const dM = new THREE.MeshStandardMaterial({
          color: 0x8b4513,
          roughness: 0.7,
        });
        donkey = new THREE.Mesh(dG, dM);
        donkey.position.set(player.position.x + 3, 0.4, player.position.z + 1);
        donkey.userData = {
          hp: 10,
          maxHp: 10,
          hasTakenDamage: false, // Flag for tutorial/score logic
          wanderTimer: 0, // Timer for wandering behavior
          wanderResetTime: 120, // How often to change wander direction
        };
        donkey.castShadow = true;
        scene.add(donkey);
        console.log("Donkey Spawned");
      }

      /**
       * Spawns a single tutorial enemy (Chaser type) at a specific position.
       * @param {THREE.Vector3} pos - The position to spawn the enemy.
       */
      function spawnTutorialEnemy(pos) {
        // Use the pre-defined chaser geometry
        const enemy = new THREE.Mesh(enemyChaserGeo, enemyChaserMat.clone());
        enemy.position.copy(pos);
        enemy.position.y = 0.4; // Place slightly above ground
        enemy.userData = {
          enemyType: EnemyType.CHASER,
          hp: 10,
          maxHp: 10,
          bulletHoles: [], // (Not currently used, legacy?)
          attackCooldown: 0,
          attackCooldownDuration: 120,
          isAttacking: false,
          attackProgress: 0,
          attackDuration: 30,
          attackTarget: null,
          attackTargetPosition: null,
          attackStartPosition: null,
          attackDamage: 1,
          boundingBox: new THREE.Box3(), // Initialize bounding box for collision
        };
        enemy.userData.boundingBox.setFromObject(enemy); // Set initial state
        enemy.castShadow = true;
        scene.add(enemy);
        enemies.push(enemy);
        enemySpawned = true; // Flag for tutorial progress
        console.log("Tutorial Enemy (Chaser) Spawned at:", pos);
      }

      /**
       * Spawns multiple enemies for tutorial phase 4.

      /**
       * Creates a tree mesh group (trunk + leaves).
       * @returns {THREE.Group} The tree group object.
       */
      function createTree() {
        const tree = new THREE.Group();
        // Randomize tree dimensions
        const tH = THREE.MathUtils.randFloat(1.5, 2.5); // Trunk height
        const tR = tH * 0.15; // Trunk radius
        // Trunk
        const tG = new THREE.CylinderGeometry(tR * 0.8, tR, tH, 8);
        const trunk = new THREE.Mesh(tG, treeTrunkMat.clone());
        trunk.position.y = tH / 2;
        trunk.castShadow = true;
        trunk.userData = { isTrunk: true }; // Mark for collision detection
        tree.add(trunk);
        // Leaves
        const lH = tH * 1.5; // Leaves height
        const lR = tH * 0.6; // Leaves radius
        const lG = new THREE.ConeGeometry(lR, lH, 8);
        const leaves = new THREE.Mesh(lG, treeLeavesMat.clone());
        leaves.position.y = tH + lH / 2 - 0.2; // Position above trunk
        leaves.castShadow = true;
        tree.add(leaves);
        // Tree group data
        tree.userData = {
          isObstacle: true,
          resourceType: ResourceType.TREE,
          hp: 5, // Health points
        };
        // Calculate bounding box for the whole tree (used for initial placement, not collision)
        const box = new THREE.Box3().setFromObject(tree);
        box.expandByScalar(0.1); // Slightly expand box
        tree.userData.boundingBox = box;
        return tree;
      }

      /**
       * Places a number of trees and rocks randomly on the ground.
       */
      function placeObstacles() {
        const numObs = 200; // Number of obstacles
        const minD = 5; // Minimum distance from center (0,0)
        const maxD = groundSize / 2 - 10; // Maximum distance from center
        for (let i = 0; i < numObs; i++) {
          let obs;
          // Choose obstacle type (more trees than rocks)
          if (Math.random() > 0.4) {
            obs = createTree();
          } else {
            obs = createRock();
          }
          // Find a random position outside the minimum distance
          let pX, pZ, dC;
          do {
            pX = THREE.MathUtils.randFloatSpread(maxD * 2); // Random X within max range
            pZ = THREE.MathUtils.randFloatSpread(maxD * 2); // Random Z within max range
            dC = Math.sqrt(pX * pX + pZ * pZ); // Distance from center
          } while (dC < minD); // Ensure it's outside the minimum distance
          obs.position.x = pX;
          obs.position.z = pZ;
          scene.add(obs);
          obstacles.push(obs); // Add to obstacles array for collision checks
        }
        console.log(`Placed ${numObs} obstacles.`);
      }

      /**
       * Creates a final connecting wall mesh between two points.
       * Also checks if the new wall traps the player and pushes them out.
       * @param {THREE.Vector3} pos1 - Start position of the wall.
       * @param {THREE.Vector3} pos2 - End position of the wall.
       */
      function createFinalWall(pos1, pos2) {
        const wallHP = 50; // Health points for walls
        const distance = pos1.distanceTo(pos2);
        if (distance < 0.1) return; // Avoid creating zero-length walls

        // Create wall geometry dynamically based on distance
        const wallGeo = new THREE.BoxGeometry(
          wallThickness,
          wallHeight,
          distance
        );
        const wallMesh = new THREE.Mesh(wallGeo, wallMat.clone());

        // Position the wall at the midpoint between the two points
        const midPoint = new THREE.Vector3()
          .addVectors(pos1, pos2)
          .multiplyScalar(0.5);
        wallMesh.position.copy(midPoint);
        wallMesh.position.y = wallHeight / 2; // Center vertically

        // Rotate the wall to align with the two points
        const angle = Math.atan2(pos1.x - pos2.x, pos1.z - pos2.z);
        wallMesh.rotation.y = angle;

        wallMesh.castShadow = true;
        wallMesh.receiveShadow = true;
        wallMesh.userData = {
          isObstacle: true,
          structureType: StructureType.WALL,
          isWall: true, // Specific flag for walls
          hp: wallHP,
          maxHp: wallHP,
        };

        console.log(
          `[DEBUG] Creating final wall between (${pos1.x.toFixed(
            1
          )}, ${pos1.z.toFixed(1)}) and (${pos2.x.toFixed(1)}, ${pos2.z.toFixed(
            1
          )})`
        );
        scene.add(wallMesh);
        obstacles.push(wallMesh); // Add wall to the main obstacles array for collision

        // --- Player Collision Check ---
        // Update the player's bounding box before checking
        player.userData.boundingBox.setFromObject(player);
        const wallBox = new THREE.Box3().setFromObject(wallMesh); // Calculate wall box

        // Check for intersection
        if (player.userData.boundingBox.intersectsBox(wallBox)) {
          console.log("[DEBUG] Player intersecting new wall! Pushing out.");
          pushPlayerOutOfObstacle(wallMesh); // Call the push function
        }
        // --- End Player Collision Check ---
      }

      /**
       * Creates a house mesh group when three sites form a valid triangle.
       * @param {THREE.Vector3[]} basePositions - Array of the three base positions.
       * @returns {THREE.Group} The house group object.
       */
      function createHouseMesh(basePositions) {
        const houseGroup = new THREE.Group();
        // Calculate centroid of the triangle
        const centroid = new THREE.Vector3()
          .addVectors(basePositions[0], basePositions[1])
          .add(basePositions[2])
          .divideScalar(3);

        // Determine approximate dimensions based on base positions
        const minX = Math.min(...basePositions.map((p) => p.x));
        const maxX = Math.max(...basePositions.map((p) => p.x));
        const minZ = Math.min(...basePositions.map((p) => p.z));
        const maxZ = Math.max(...basePositions.map((p) => p.z));
        const width = maxX - minX;
        const depth = maxZ - minZ;
        const baseHeight = 2.0;

        // Create the base of the house
        const baseGeo = new THREE.BoxGeometry(width, baseHeight, depth);
        const baseMesh = new THREE.Mesh(baseGeo, buildingMat.clone()); // Use building material for base
        baseMesh.position.set(centroid.x, baseHeight / 2, centroid.z);
        baseMesh.castShadow = true;
        baseMesh.receiveShadow = true;
        houseGroup.add(baseMesh);

        // Create a simple roof
        const roofHeight = 1.5;
        // Use a cone geometry for a basic roof shape
        const roofGeo = new THREE.ConeGeometry(
          Math.max(width, depth) * 0.7,
          roofHeight,
          4
        ); // 4 sides for pyramid shape
        const roofMesh = new THREE.Mesh(roofGeo, roofMat.clone()); // Use roof material
        roofMesh.position.set(
          centroid.x,
          baseHeight + roofHeight / 2,
          centroid.z
        ); // Position on top of the base
        roofMesh.rotation.y = Math.PI / 4; // Align roof edges better
        roofMesh.castShadow = true;
        roofMesh.receiveShadow = true;
        houseGroup.add(roofMesh);

        houseGroup.position.y = 0; // Ensure base is on the ground
        houseGroup.userData = {
          isObstacle: true,
          structureType: StructureType.HOUSE,
          isHouse: true, // Specific flag for houses
          hp: 300,
          maxHp: 300, // Houses are stronger
          basePositions, // Store the original base positions if needed
        };

        // Add a completed range indicator (optional, could be removed for houses)
        const indicator = new THREE.Mesh(
          rangeIndicatorGeo,
          rangeIndicatorCompletedMat.clone()
        );
        indicator.position.copy(centroid);
        indicator.position.y = 0.05;
        indicator.rotation.x = -Math.PI / 2;
        indicator.visible = false; // Keep it hidden by default for completed houses
        scene.add(indicator);
        rangeIndicators[houseGroup.uuid] = { mesh: indicator }; // Store indicator reference
        houseGroup.userData.indicatorUUID = houseGroup.uuid; // Link house to its indicator

        console.log(
          `[DEBUG] House created at (${centroid.x.toFixed(
            1
          )}, ${centroid.z.toFixed(1)}), Size: ${width.toFixed(
            1
          )}x${depth.toFixed(1)}`
        );
        return houseGroup;
      }

      /**
       * Checks if three positions form a valid, compact triangle for house creation.
       * @param {THREE.Vector3} posA - Position of the first site.
       * @param {THREE.Vector3} posB - Position of the second site.
       * @param {THREE.Vector3} posC - Position of the third site.
       * @param {number} radius - The build proximity radius.
       * @returns {boolean} True if the triangle is valid for a house.
       */
      function canFormHouse(posA, posB, posC, radius) {
        const radiusSq = radius * radius;
        const maxDistSq = 4 * radiusSq; // Max squared distance between connected sites (2*radius)^2

        // Step 1: Check distances between all pairs (ensure they are connected)
        const distAB = posA.distanceToSquared(posB);
        const distBC = posB.distanceToSquared(posC);
        const distCA = posC.distanceToSquared(posA);

        if (
          !(distAB <= maxDistSq && distBC <= maxDistSq && distCA <= maxDistSq)
        ) {
          console.log(
            `[DEBUG] House check failed: Points not connected within 2*radius. AB=${Math.sqrt(
              distAB
            ).toFixed(1)}, BC=${Math.sqrt(distBC).toFixed(1)}, CA=${Math.sqrt(
              distCA
            ).toFixed(1)}`
          );
          return false;
        }
        console.log(
          `[DEBUG] House check: Points connected. AB=${Math.sqrt(
            distAB
          ).toFixed(1)}, BC=${Math.sqrt(distBC).toFixed(1)}, CA=${Math.sqrt(
            distCA
          ).toFixed(1)}`
        );

        // Step 2: Check area-to-perimeter ratio for compactness (prevent long, thin triangles)
        const a = Math.sqrt(distAB);
        const b = Math.sqrt(distBC);
        const c = Math.sqrt(distCA);
        const s = (a + b + c) / 2; // Semi-perimeter
        const area = Math.sqrt(Math.max(0, s * (s - a) * (s - b) * (s - c))); // Heron's formula
        const perimeter = a + b + c;

        if (perimeter === 0) return false; // Avoid division by zero for degenerate triangles

        const ratio = area / perimeter;
        const minRatio = 0.7; // Tuned threshold for compactness (adjust as needed)

        console.log(
          `[DEBUG] House check: Area=${area.toFixed(
            1
          )}, Perimeter=${perimeter.toFixed(1)}, Ratio=${ratio.toFixed(
            2
          )} (min=${minRatio})`
        );
        if (ratio < minRatio) {
          console.log(
            `[DEBUG] House check failed: Shape too elongated (ratio ${ratio.toFixed(
              2
            )} < ${minRatio})`
          );
          return false;
        }

        // Step 3: Optional - Check if centroid is covered (less critical if ratio is good)
        // const centroid = new THREE.Vector3().add(posA).add(posB).add(posC).divideScalar(3);
        // const distCentroidA = centroid.distanceToSquared(posA);
        // const distCentroidB = centroid.distanceToSquared(posB);
        // const distCentroidC = centroid.distanceToSquared(posC);
        // if (!(distCentroidA <= radiusSq || distCentroidB <= radiusSq || distCentroidC <= radiusSq)) {
        //     console.log(`[DEBUG] House check failed: Centroid not covered.`);
        //     return false;
        // }

        console.log(`[DEBUG] House check passed: Compact and connected.`);
        return true;
      }

      /**
       * Pushes the player object out of an intersecting obstacle mesh.
       * Calculates the minimum push vector required to resolve the collision.
       * @param {THREE.Mesh | THREE.Group} obstacleMesh - The obstacle the player is colliding with.
       */
      function pushPlayerOutOfObstacle(obstacleMesh) {
        // Ensure player bounding box is up-to-date (should be after movePlayer)
        const playerBox = player.userData.boundingBox;
        // Calculate the obstacle's current bounding box
        const obstacleBox = new THREE.Box3().setFromObject(obstacleMesh);

        // Calculate overlap on X and Z axes
        const overlapX = Math.max(
          0,
          Math.min(playerBox.max.x, obstacleBox.max.x) -
            Math.max(playerBox.min.x, obstacleBox.min.x)
        );
        const overlapZ = Math.max(
          0,
          Math.min(playerBox.max.z, obstacleBox.max.z) -
            Math.max(playerBox.min.z, obstacleBox.min.z)
        );

        if (overlapX === 0 && overlapZ === 0) return; // No overlap (shouldn't happen if called correctly)

        let pushX = 0;
        let pushZ = 0;
        const epsilon = 0.01; // Small buffer to ensure separation after push

        // Determine minimum overlap axis and push direction
        if (overlapX < overlapZ) {
          // Push along X axis
          const playerCenterX = (playerBox.min.x + playerBox.max.x) / 2;
          const obstacleCenterX = (obstacleBox.min.x + obstacleBox.max.x) / 2;
          // Push away from the obstacle's center
          pushX =
            playerCenterX < obstacleCenterX
              ? -(overlapX + epsilon)
              : overlapX + epsilon;
        } else {
          // Push along Z axis
          const playerCenterZ = (playerBox.min.z + playerBox.max.z) / 2;
          const obstacleCenterZ = (obstacleBox.min.z + obstacleBox.max.z) / 2;
          // Push away from the obstacle's center
          pushZ =
            playerCenterZ < obstacleCenterZ
              ? -(overlapZ + epsilon)
              : overlapZ + epsilon;
        }

        // Apply the push vector to the player's position
        player.position.x += pushX;
        player.position.z += pushZ;

        // IMPORTANT: Update player bounding box again immediately after pushing
        player.userData.boundingBox.setFromObject(player);
        console.log(
          `[DEBUG] Pushed player by (${pushX.toFixed(2)}, ${pushZ.toFixed(2)})`
        );

        // Optional: Add a small visual effect or sound for the push?
      }

      // --- Update Functions ---

      /**
       * Updates the camera position and orientation based on zoom level and player position.
       */
      function updateCamera() {
        const targetPos = player.position.clone(); // Target point for the camera to look at
        targetPos.y += 0.5; // Look slightly above the player's base

        if (zoomLevel <= 0) {
          // First-person view
          camera.position.copy(targetPos); // Camera is at the player's head position
          camera.rotation.order = "YXZ"; // Set rotation order for FP control
          camera.rotation.y = fpYaw;
          camera.rotation.x = fpPitch;
          camera.rotation.z = 0; // No roll
        } else {
          // Third-person view
          // Interpolate distance and height based on zoom level
          const dist = THREE.MathUtils.lerp(0, tpDistance, zoomLevel);
          const h = THREE.MathUtils.lerp(0.5, tpHeight, zoomLevel);
          // Calculate camera offset based on pitch and yaw
          const horizontalDist = dist * Math.cos(tpPitch);
          const verticalDist = dist * Math.sin(tpPitch);
          const offsetX = horizontalDist * Math.sin(tpYaw);
          const offsetY = -verticalDist + h;
          const offsetZ = horizontalDist * Math.cos(tpYaw);
          // Calculate final camera position
          const cameraPos = player.position
            .clone()
            .add(new THREE.Vector3(offsetX, offsetY, offsetZ));
          camera.position.copy(cameraPos);
          camera.lookAt(targetPos); // Always look at the player target point
        }
      }

      // --- Collision Check Helpers ---
      const playerCollider = new THREE.Box3(); // Reusable Box3 for player collision checks
      const enemyCollider = new THREE.Box3(); // Reusable Box3 for enemy collision checks
      const obstacleCollider = new THREE.Box3(); // Reusable Box3 for obstacle collision checks

      /**
       * Checks if a potential player movement vector results in a collision.
       * @param {THREE.Vector3} moveVector - The potential movement vector.
       * @returns {boolean} True if collision occurs, false otherwise.
       */
      function checkPlayerCollision(moveVector) {
        // Create a temporary bounding box at the potential new position
        playerCollider
          .copy(player.geometry.boundingBox)
          .applyMatrix4(player.matrixWorld);
        playerCollider.translate(moveVector);

        // Check against all obstacles
        for (const obstacle of obstacles) {
          if (!obstacle || !obstacle.parent) continue; // Skip removed or invalid obstacles

          let intersects = false;
          // Special handling for trees (only collide with trunk)
          if (
            obstacle.userData.resourceType === ResourceType.TREE &&
            obstacle.isGroup
          ) {
            for (const child of obstacle.children) {
              if (child.userData?.isTrunk) {
                obstacleCollider.setFromObject(child); // Use trunk's bounding box
                if (playerCollider.intersectsBox(obstacleCollider)) {
                  intersects = true;
                  break; // Collision found with this tree
                }
              }
            }
          }
          // Handling for other obstacles (rocks, walls, buildings, flags, houses)
          else if (obstacle.userData.isObstacle) {
            obstacleCollider.setFromObject(obstacle); // Use the obstacle's bounding box
            if (playerCollider.intersectsBox(obstacleCollider)) {
              intersects = true;
            }
          }

          if (intersects) return true; // Collision detected with an obstacle
        }

        // Check against active construction sites
        for (const site of constructionSites) {
          if (!site || !site.parent) continue;
          obstacleCollider.setFromObject(site);
          if (playerCollider.intersectsBox(obstacleCollider)) {
            return true; // Collision detected with a construction site
          }
        }

        return false; // No collision detected
      }

      /**
       * NEW: Checks if a potential enemy movement vector results in a collision.
       * @param {THREE.Mesh} enemy - The enemy mesh attempting to move.
       * @param {THREE.Vector3} moveVector - The potential movement vector.
       * @returns {boolean} True if collision occurs, false otherwise.

      function checkEnemyCollision(enemy, moveVector) {
